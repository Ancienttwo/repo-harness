schemaVersion: archcontext.node/v2
id: capability.runtime-harness.hook-adapters
kind: capability
name: Hook Adapters
status: active
summary: Installs and runs typed Claude and Codex host hook routes.
responsibilities:
  - Own managed hook entries, route dispatch, mutation observation, and Stop handling.
source:
  include:
    - "assets/hooks/**"
    - ".ai/hooks/**"
    - "scripts/run-skill-hook.ts"
    - "src/cli/installer/**"
    - "src/cli/hook/**"
    - "src/cli/hook-entry.ts"
extensions:
  contractFiles:
    agents: "assets/hooks/AGENTS.md"
    claude: "assets/hooks/CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/hook-runtime.test.ts tests/hook-contracts.test.ts tests/workflow-contract.test.ts"
    - "bash scripts/check-task-workflow.sh --strict"
