schemaVersion: archcontext.node/v2
id: capability.runtime-harness.hook-adapters
kind: capability
name: Hook Adapters
status: active
summary: Installs and runs typed Claude, Codex, and Pi host hook routes.
responsibilities:
  - Own managed hook entries, route dispatch, mutation observation, and Stop handling.
  - Own the Pi package event adapter and its bounded Bun JSON bridge.
source:
  include:
    - "assets/hooks/**"
    - ".ai/hooks/**"
    - "src/cli/installer/**"
    - "src/cli/hook/**"
    - "src/cli/hook-entry.ts"
    - "src/pi/**"
  entrypoints:
    - id: entrypoint.hook-adapters.primary
      path: "src/cli/hook/mutation-observed.ts"
      symbols:
        - name: "processArchitectureCascade"
          sinks:
            - id: sink.hook-adapters.primary
              path: "src/cli/hook/mutation-observed.ts"
              symbol: "runRepoHarnessHelper"
extensions:
  contractFiles:
    agents: "assets/hooks/AGENTS.md"
    claude: "assets/hooks/CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/hook-runtime.test.ts tests/hook-contracts.test.ts tests/workflow-contract.test.ts"
    - "bash scripts/check-task-workflow.sh"
