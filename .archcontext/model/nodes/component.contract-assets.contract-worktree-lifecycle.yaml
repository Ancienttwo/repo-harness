schemaVersion: archcontext.node/v2
id: component.contract-assets.contract-worktree-lifecycle
kind: component
name: Contract Worktree Lifecycle
status: active
parent: capability.workflow-engine.contract-assets
summary: Starts, finishes, publishes and archives contract work packages in task worktrees behind the local merge gate.
responsibilities:
  - Create and recover task worktrees under the worktree topology lock.
  - Seal a work package and publish one commit per work package to the target.
  - Run the local merge gate with the enable bit read from the target base commit.
  - Run contract briefs and archive finished workflow artifacts.
source:
  include:
    - scripts/contract-run.ts
    - scripts/contract-worktree.sh
    - scripts/contract-worktree-runtime.ts
    - scripts/worktree-merge-lib.sh
    - scripts/ship-worktrees.sh
    - scripts/merge-gate.ts
    - scripts/archive-workflow.sh
    - scripts/cutover-closure.ts
