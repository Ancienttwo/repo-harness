{
  "schemaVersion": "archcontext.node/v2",
  "id": "capability.workflow-engine.contract-assets",
  "kind": "capability",
  "name": "Contract Assets",
  "status": "active",
  "layer": "assets",
  "summary": "Owns the package workflow contract, repo opt-in marker, templates, capability nodes, and the standalone resolver projection.",
  "responsibilities": [
    "Own the package workflow contract body and the repo opt-in marker.",
    "Own policy seeders, capability authority, and the standalone resolver projection.",
    "Own isolated worktree start and cleanup, branch-only PR shipping, explicit workflow archival and the planning helpers listed by the package contract."
  ],
  "source": {
    "include": [
      "assets/workflow-contract.v1.json",
      ".ai/context/**",
      ".archcontext/model/nodes/**",
      "scripts/capability-resolver.ts",
      "scripts/capability-config.ts",
      "scripts/contract-worktree.sh",
      "scripts/archive-workflow.sh",
      "scripts/merge-gate.ts",
      "scripts/ship-worktrees.sh",
      "src/cli/commands/init.ts",
      "src/cli/commands/capability-context.ts",
      "src/effects/runtime/helper-runner.ts",
      "assets/templates/**",
      "assets/reference-configs/**",
      "docs/reference-configs/**",
      "assets/AGENTS.md",
      "assets/CLAUDE.md",
      ".archcontext/**",
      "docs/adr/**",
      "src/core/capabilities/**",
      "src/effects/source-projection.ts",
      "src/cli/commands/run.ts",
      "src/cli/commands/brain.ts",
      "src/cli/commands/brain-root.ts",
      "assets/project-structures/**",
      "assets/plan-map.json",
      "assets/versions.json",
      ".claude/templates/**",
      "scripts/workflow-contract.ts",
      "scripts/check-context-map.ts",
      "scripts/check-context-files.sh",
      "scripts/select-agent-context-blocks.sh",
      "scripts/workstream-sync.sh",
      "scripts/sync-helper-sources.ts",
      "scripts/sync-reference-configs.ts",
      "scripts/contract-worktree-runtime.ts",
      "scripts/worktree-merge-lib.sh",
      "scripts/cutover-closure.ts",
      "scripts/new-spec.sh",
      "scripts/new-plan.sh",
      "scripts/capture-plan.sh",
      "scripts/plan-to-todo.sh",
      "scripts/switch-plan.sh",
      "scripts/classify-historical-plans.ts",
      "scripts/ensure-task-workflow.sh",
      "scripts/refresh-current-status.sh",
      "scripts/summarize-failures.sh",
      "scripts/maintenance-triage.sh",
      "scripts/heartbeat-triage.sh",
      "scripts/check-deploy-sql-order.sh",
      "scripts/factor-lab-new.sh",
      "scripts/factor-lab-promote.sh",
      "scripts/factor-lab-reject.sh",
      "scripts/factor-lab-check.sh",
      "src/cli/commands/retention.ts",
      "src/effects/artifact-retention.ts"
    ],
    "exclude": [
      "assets/reference-configs/external-tooling.md",
      "docs/reference-configs/external-tooling.md",
      "docs/reference-configs/install-profiles.md",
      "docs/reference-configs/chatgpt-coding-mcp.md",
      "docs/architecture/**",
      "docs/researches/**",
      ".ai/harness/**",
      "docs/design/**",
      "references/plugins-core.md"
    ],
    "entrypoints": [
      {
        "id": "entrypoint.contract-assets.primary",
        "path": "scripts/sync-helper-sources.ts",
        "symbols": [
          {
            "name": "main",
            "sinks": [
              {
                "id": "sink.contract-assets.capability-projection",
                "path": "scripts/sync-helper-sources.ts",
                "symbol": "buildCapabilityProjection"
              },
              {
                "id": "sink.contract-assets.projection-write",
                "path": "src/effects/source-projection.ts",
                "symbol": "writeProjectionFileAtomic"
              },
              {
                "id": "sink.contract-assets.projection-compare",
                "path": "src/effects/source-projection.ts",
                "symbol": "sameProjectionBytes"
              }
            ]
          }
        ]
      },
      {
        "id": "entrypoint.contract-assets.run-command",
        "path": "src/cli/commands/run.ts",
        "symbols": [
          {
            "name": "buildRunCommand",
            "sinks": [
              {
                "id": "sink.contract-assets.helper-runner",
                "path": "src/effects/runtime/helper-runner.ts",
                "symbol": "runHelper"
              }
            ]
          }
        ]
      },
      {
        "id": "entrypoint.contract-assets.helper-runner",
        "path": "src/effects/runtime/helper-runner.ts",
        "symbols": [
          {
            "name": "runHelper",
            "sinks": [
              {
                "id": "sink.contract-assets.bounded-process",
                "path": "src/effects/process-runner.ts",
                "symbol": "runProcess"
              }
            ]
          }
        ]
      }
    ]
  },
  "extensions": {
    "contractFiles": {
      "agents": "assets/AGENTS.md",
      "claude": "assets/CLAUDE.md"
    },
    "lspProfile": "typescript-lsp",
    "verification": [
      "bun test tests/workflow-contract.test.ts tests/scaffold-parity.test.ts",
      "bun scripts/capability-resolver.ts validate --format text",
      "bun run check:helpers"
    ]
  }
}
