schemaVersion: archcontext.node/v2
id: component.hook-adapters.session-lifecycle
kind: component
name: "Session Lifecycle Handlers"
status: active
parent: capability.runtime-harness.hook-adapters
summary: "Typed handlers for SessionStart context, Stop deferred work, subagent routes and the Task Inbox."
responsibilities:
  - Build the SessionStart sections from Effective State and the session providers.
  - Drain the post-edit journal, refresh handoff and resume projections and sweep run summaries at Stop.
  - Validate native subagent starts and keep the delegation advisor state.
  - Deliver Task Inbox messages and the board slice as untrusted context.
source:
  include:
    - "src/cli/hook/session-context.ts"
    - "src/cli/hook/stop-handler.ts"
    - "src/cli/hook/subagent-handler.ts"
    - "src/cli/hook/delegation-state.ts"
    - "src/cli/hook/task-inbox-handler.ts"
    - "src/cli/hook/board-slice-context.ts"
    - "src/cli/hook/state-snapshot.ts"
    - "src/effects/run-summary-retention.ts"
  entrypoints:
    - id: entrypoint.hook-adapters.stop
      path: "src/cli/hook/stop-handler.ts"
      symbols:
        - name: "runStopHandler"
          sinks:
            - id: sink.hook-adapters.evidence-checkpoint
              path: "src/effects/evidence/checkpoint-store.ts"
              symbol: "publishCheckpointFromLedger"
