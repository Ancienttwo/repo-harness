{
  "schemaVersion": "archcontext.node/v2",
  "id": "capability.organization.task-fleet",
  "kind": "capability",
  "name": "Task Fleet",
  "status": "active",
  "summary": "Reads task offers and fleet boards for the operator and retains task message storage.",
  "responsibilities": [
    "Join registry authorization, canonical Sprint rows, lease availability and plan proof into immutable read-time task offers.",
    "Store immutable task messages and separate per-recipient delivery receipts that never mutate a lease or wake a runtime.",
    "Project the cross-repository fleet board from authority readers without persisting any column or readiness flag."
  ],
  "source": {
    "include": [
      "src/core/fleet/**",
      "src/effects/fleet/**",
      "src/cli/commands/fleet.ts",
      "src/core/messages/mechanics.ts"
    ],
    "entrypoints": [
      {
        "id": "entrypoint.task-fleet.command",
        "path": "src/cli/commands/fleet.ts",
        "symbols": [
          {
            "name": "buildFleetCommand",
            "sinks": [
              {
                "id": "sink.task-fleet.send-message",
                "path": "src/effects/fleet/task-inbox.ts",
                "symbol": "sendTaskMessage"
              },
              {
                "id": "sink.task-fleet.deliver-message",
                "path": "src/effects/fleet/task-inbox.ts",
                "symbol": "deliverTaskInbox"
              }
            ]
          }
        ]
      }
    ]
  },
  "extensions": {
    "contractFiles": {
      "agents": "AGENTS.md",
      "claude": "CLAUDE.md"
    },
    "lspProfile": "typescript-lsp",
    "verification": [
      "bun run test:files tests/effects/fleet-board.test.ts tests/effects/task-inbox.test.ts tests/effects/task-inbox-layout-migration.test.ts tests/cli/fleet-task-inbox.test.ts tests/unit/task-message-v1.test.ts --timeout 60000 --max-concurrency 1",
      "bun run check:type"
    ]
  }
}
