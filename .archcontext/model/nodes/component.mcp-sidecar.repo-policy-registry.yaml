schemaVersion: archcontext.node/v2
id: component.mcp-sidecar.repo-policy-registry
kind: component
name: "Config Policy and Repository Registry"
status: active
parent: capability.runtime-harness.mcp-sidecar
layer: "cli"
summary: "Holds the user-level MCP config and credentials, the profile path policy, redaction, audit and the registered repository grants."
responsibilities:
  - Read and write the single user-level MCP config and credential store.
  - Resolve repository roots and paths under the profile policy and contain workspace paths.
  - Redact secrets and append the redacted MCP audit log.
  - Set repository access grants through the shared repository registry.
source:
  include:
    - src/cli/mcp/auth.ts
    - src/cli/mcp/types.ts
    - src/cli/mcp/policy.ts
    - src/cli/mcp/paths.ts
    - src/cli/mcp/repo.ts
    - src/cli/mcp/redaction.ts
    - src/cli/mcp/guarded-write.ts
    - src/cli/mcp/workspaces.ts
    - src/cli/mcp/audit.ts
    - src/cli/commands/bots.ts
