schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.engineering-overlay"
kind: "capability"
name: "Engineering Overlay"
status: "active"
summary: "Projects provider scheduling, independently selected engineer profiles and exact admitted runtime evidence into read-only engineering and organization attention views."
responsibilities:
  - "Build content-addressed EngineeringOverlaySnapshotV2 and OrganizationAttentionSnapshotV2 from explicit provider scheduling and admitted session evidence."
  - "Join runtime intents only on exact current session binding, admission, grant, role, task and selected profile revision; never infer engineer identity from actor identity."
  - "Double-read scheduling and runtime component observations and expose stable, changed_during_read or degraded; unavailable evidence never becomes healthy empty data."
  - "Report unassigned or missing profiles, profile revision drift and runtime reconciliation without task acquisition or mutable status."
  - "Preserve provider issue state and every observed authority; the V2 builder rejects mismatched scheduling repository identity and hashes the resulting typed projection."
source:
  include:
    - "src/core/engineers/engineering-overlay.ts"
    - "src/effects/engineers/engineering-overlay.ts"
  entrypoints:
    - id: "entrypoint.engineering-overlay.collect"
      path: "src/effects/engineers/engineering-overlay.ts"
      symbols:
        - name: "collectEngineeringBoard"
          sinks:
            - id: "sink.engineering-overlay.read-pass"
              path: "src/effects/engineers/engineering-overlay.ts"
              symbol: "runtimeProjection"
            - id: "sink.engineering-overlay.schema"
              path: "src/core/engineers/engineering-overlay.ts"
              symbol: "buildAdmittedEngineeringOverlay"
            - id: "sink.engineering-overlay.attention-schema"
              path: "src/core/engineers/engineering-overlay.ts"
              symbol: "projectAdmittedOrganizationAttention"
    - id: "entrypoint.engineering-overlay.overlay-schema"
      path: "src/core/engineers/engineering-overlay.ts"
      symbols:
        - name: "buildAdmittedEngineeringOverlay"
          sinks:
            - id: "sink.engineering-overlay.overlay-validation"
              path: "src/core/engineers/engineering-overlay.ts"
              symbol: "invalid"
            - id: "sink.engineering-overlay.overlay-digest"
              path: "src/core/engineers/profile-binding.ts"
              symbol: "canonicalEngineerJson"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/me1b-engineering-overlay.test.ts --timeout 60000"
    - "bun run check:type"
