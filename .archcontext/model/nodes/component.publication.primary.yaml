schemaVersion: archcontext.node/v2
id: component.publication.primary
kind: component
name: Publication Record and Readiness Readers
status: active
parent: capability.organization.publication
summary: Reads historical receipts and integration records, observes provider merge proof and derives PR readiness.
responsibilities:
  - Validate and read historical PublicationReceipt protocol 3 records without creating receipts or editing PR markers.
  - Read historical integration observations for dependency inspection without changing lease ownership.
  - Read provider merge proof for worktree cleanup and project readiness with typed blockers.
source:
  include:
    - "src/core/publication/**"
    - "src/effects/publication/publication-*.ts"
    - "src/effects/publication/merge-readiness.ts"
    - "src/cli/commands/publication.ts"
  exclude:
    - "src/core/publication/feedback.ts"
