schemaVersion: "archcontext.node/v2"
id: "component.publication.primary"
kind: "component"
name: "Publication Record and Readiness Readers"
status: "active"
parent: "capability.organization.publication"
summary: "Retains historical receipt reads and observes canonical provider PR readiness and actual merge commit/tree evidence."
responsibilities:
  - "Read historical publication and integration records without promoting them to current task or PR authority."
  - "Use the shared explicit provider identity, facts and reobservation collector for readiness and integration evidence with typed unavailable results."
  - "Provide provider merge proof to exact worktree cleanup and product integration consumers."
source:
  include:
    - "src/core/publication/**"
    - "src/effects/publication/publication-*.ts"
    - "src/effects/publication/merge-readiness.ts"
    - "src/cli/commands/publication.ts"
  exclude:
    - "src/core/publication/feedback.ts"
