schemaVersion: "archcontext.node/v2"
id: "component.publication.primary"
kind: "component"
name: "PR Readiness and Integration Evidence"
status: "active"
parent: "capability.organization.publication"
summary: "Observes canonical provider PR readiness and actual merge commit/tree evidence, and provides the canonical publication JSON and SHA-256 digest helpers."
responsibilities:
