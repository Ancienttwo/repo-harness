schemaVersion: archcontext.node/v2
id: component.hook-adapters.host-installer
kind: component
name: "Host Adapter Installer"
status: active
parent: capability.runtime-harness.hook-adapters
layer: "cli"
summary: "Projects Claude and Codex adapters, maps Pi events through the hook bridge, and owns host package and skill installation."
responsibilities:
  - Build and compare managed Claude and Codex hook entries from the ordered route registry.
  - Map Pi session, prompt, direct and nested tool events to the shared hook process; enforce the capability probe, wire limits and stale-result boundary.
  - Install and remove the native Pi package entry through Pi CLI commands, and record removal ownership only for a newly created source.
  - Project the catalog-selected skills to Claude, Codex and Pi roots without a second Pi package skill declaration.
  - Apply and roll back install profiles under the runtime host lock.
  - Report host install status and scan local hook and task configurations for injection surfaces without mutation.
source:
  include:
    - src/cli/installer/**
    - src/pi/**
    - src/cli/commands/install.ts
    - src/cli/commands/status.ts
    - src/cli/commands/security.ts
  entrypoints:
    - id: entrypoint.hook-adapters.managed-entries
      path: "src/cli/installer/managed-entries.ts"
      symbols:
        - name: "buildManagedHooks"
          sinks:
            - id: sink.hook-adapters.routes-for-host
              path: "src/cli/hook/route-registry.ts"
              symbol: "routesForHost"
    - id: entrypoint.hook-adapters.pi-extension
      path: "src/pi/extension.ts"
      symbols:
        - name: "repoHarnessPi"
          sinks:
            - id: sink.hook-adapters.pi-registration
              path: "src/pi/extension.ts"
              symbol: "registerPiHooks"
    - id: entrypoint.hook-adapters.skill-projection
      path: "src/cli/installer/skill-projection.ts"
      symbols:
        - name: "expectedSkillProjections"
          sinks:
            - id: sink.hook-adapters.skill-placements
              path: "src/core/skill-surface/catalog.ts"
              symbol: "hostSkillPlacements"
            - id: sink.hook-adapters.skill-root
              path: "src/effects/host-skill-roots.ts"
              symbol: "hostSkillRoot"
