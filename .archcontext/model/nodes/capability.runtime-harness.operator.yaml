schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.operator"
kind: "capability"
name: "Operator Board"
status: "active"
summary: "Provides bounded read-only HTTP views of registered provider issues, admitted sessions, planning and explicit task history."
responsibilities:
  - "Serve public observations through GET and HEAD routes."
  - "Read architecture facts through the shared model reader in a bounded worker."
  - "Collect setup and development activity in bounded background collectors; GET reads only their cache."
  - "Keep commands in the Bot and CLI channel."
  - "Expose bounded shared admitted-session discovery over HTTP; closed, revoked or unavailable selections never become implicit current tasks. Task Agent Host owns the shared selector and discovery effects."
  - "Serve exact-selector diff, activity and protected goal/verification context with live admission reobservation and closed response decoding."
  - "Project provider planning and fleet cards without inferring engineer identity from actor identity; retain explicit historical routes without current-to-history fallback."
source:
  include:
    - "assets/tool-catalog.v1.json"
    - "docs/kanban-runtime-status.md"
    - "src/core/tools/catalog.ts"
    - "src/core/operator/**"
    - "src/effects/operator/**"
    - "src/operator-web/**"
    - "src/cli/commands/operator.ts"
    - "src/cli/commands/catch-up.ts"
    - "src/cli/commands/module.ts"
    - "src/core/architecture/module-view.ts"
    - "src/core/setup/**"
    - "src/effects/setup/**"
    - "src/cli/commands/setup-snapshot.ts"
    - "src/cli/commands/setup-check-child.ts"
    - "src/core/dev-activity/**"
    - "src/effects/dev-activity/**"
    - "src/effects/terminal/herdr-observation.ts"
    - "assets/operator/**"
    - "vite.operator.config.ts"
  entrypoints:
    - id: "entrypoint.operator.primary"
      path: "src/effects/operator/architecture.ts"
      symbols:
        - name: "readArchitecture"
          sinks:
            - id: "sink.operator.primary"
              path: "src/core/operator/architecture.ts"
              symbol: "decodeArchitectureModuleIndex"
            - id: "sink.operator.model-reader-list"
              path: "src/effects/architecture/model-reader.ts"
              symbol: "list"
    - id: "entrypoint.operator.organization-validation"
      path: "src/effects/operator/repository-snapshot.ts"
      symbols:
        - name: "assertOperatorRepositorySnapshotIdentity"
          sinks:
            - id: "sink.operator.organization-validation"
              path: "src/core/operator/organization-snapshot.ts"
              symbol: "decodeOperatorOrganizationSnapshot"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run check:type"
    - "bun run test:files tests/cli/operator-serve.test.ts tests/effects/operator-write-boundary.test.ts --timeout 60000 --max-concurrency 1"
