schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.operator"
kind: "capability"
name: "Operator Board"
status: "active"
layer: "web"
summary: "Provides bounded read-only HTTP views of registered provider issues, admitted sessions and explicit task history."
responsibilities:
  - "Serve public observations through GET and HEAD routes."
  - "Read architecture facts through the shared model reader in a bounded worker."
  - "Collect setup, development activity, CLI inventory, Bot access, notify status, docs and daily test results in bounded background collectors; GET reads only their cache, except that a docs file GET asks the resident cat-file worker of the docs collector for one object."
  - "Keep commands in the Bot and CLI channel."
  - "Expose bounded shared admitted-session discovery over HTTP; closed, revoked or unavailable selections never become implicit current tasks. Task Agent Host owns the shared selector and discovery effects."
  - "Serve exact-selector diff, activity and protected goal/verification context with live admission reobservation and closed response decoding."
  - "Project provider fleet cards; retain explicit historical routes without current-to-history fallback."
source:
  include:
    - docs/kanban-runtime-status.md
    - src/effects/operator/**
    - src/operator-web/**
    - src/effects/setup/**
    - src/effects/dev-activity/**
    - src/effects/terminal/herdr-observation.ts
    - vite.operator.config.ts
  entrypoints:
    - id: "entrypoint.operator.primary"
      path: "src/effects/operator/architecture.ts"
      symbols:
        - name: "readArchitecture"
          sinks:
            - id: "sink.operator.primary"
              path: "src/core/operator/architecture.ts"
              symbol: "decodeArchitectureModuleIndex"
            - id: "sink.operator.model-reader-list"
              path: "src/effects/architecture/model-reader.ts"
              symbol: "list"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run check:type"
    - "bun run test:files tests/cli/operator-serve.test.ts tests/effects/operator-write-boundary.test.ts --timeout 60000 --max-concurrency 1"
