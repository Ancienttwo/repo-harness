schemaVersion: archcontext.node/v2
id: capability.runtime-harness.operator
kind: capability
name: Operator Board
status: active
summary: Provides local read-only HTTP views of registered repositories.
responsibilities:
  - Serve public observations through GET and HEAD routes.
  - Read architecture facts through the shared model reader in a bounded worker.
  - Collect setup and development activity in bounded background collectors; GET reads only their cache.
  - Keep commands in the Bot and CLI channel.
source:
  include:
    - src/core/operator/**
    - src/effects/operator/**
    - src/operator-web/**
    - src/cli/commands/operator.ts
    - src/cli/commands/module.ts
    - src/core/architecture/module-view.ts
    - src/core/review/module-review-prompt.ts
    - src/core/docs/**
    - src/core/setup/**
    - src/effects/setup/**
    - src/core/dev-activity/**
    - src/effects/dev-activity/**
    - src/effects/terminal/herdr-observation.ts
    - assets/operator/**
    - vite.operator.config.ts
  entrypoints:
    - id: entrypoint.operator.primary
      path: src/effects/operator/architecture.ts
      symbols:
        - name: readArchitecture
          sinks:
            - id: sink.operator.primary
              path: src/core/operator/architecture.ts
              symbol: decodeArchitectureModuleIndex
            - id: sink.operator.model-reader-list
              path: src/effects/architecture/model-reader.ts
              symbol: list
extensions:
  contractFiles:
    agents: AGENTS.md
    claude: CLAUDE.md
  lspProfile: typescript-lsp
  verification:
    - bun run check:type
    - bun run test:files tests/cli/operator-serve.test.ts tests/effects/operator-write-boundary.test.ts --timeout 60000 --max-concurrency 1
