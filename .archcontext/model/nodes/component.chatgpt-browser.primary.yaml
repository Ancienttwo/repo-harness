schemaVersion: archcontext.node/v2
id: component.chatgpt-browser.primary
kind: component
name: "Browser Consult Engine"
status: active
parent: capability.runtime-mcp.chatgpt-browser
summary: "Assembles the prompt bundle, scans it, runs the Oracle or native provider and writes the session record."
responsibilities:
  - Resolve the browser binding and the provider and refuse an unbound or unsafe profile.
  - Assemble and optionally secret-scan the exact rendered prompt and follow-ups.
  - Write and read repo-local session records.
source:
  include:
    - src/cli/chatgpt-browser/**
    - src/cli/chatgpt-skill/**
    - src/cli/commands/chatgpt.ts
  exclude:
    - src/cli/chatgpt-browser/file-policy.ts
  entrypoints:
    - id: entrypoint.chatgpt-browser.consult
      path: src/cli/chatgpt-browser/engine.ts
      symbols:
        - name: runBrowserConsult
          sinks:
            - id: sink.chatgpt-browser.secret-scan
              path: src/cli/chatgpt-browser/secret-scan.ts
              symbol: scanPromptBundle
