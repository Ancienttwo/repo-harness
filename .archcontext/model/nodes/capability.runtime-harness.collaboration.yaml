schemaVersion: archcontext.node/v2
id: capability.runtime-harness.collaboration
kind: capability
name: Collaboration Substrate
status: active
summary: Publishes append-only coordination signals, work-state handoffs and non-exclusive handoff adoption receipts over one shared create-once store substrate, with Host-derived identity and recorded time, holding zero Task, Lease, Publication or Acceptance authority.
responsibilities:
  - Own the shared collaboration mechanics frozen for later rows, namely the actor union, revision-bound scope refs, the reused WorkerResult evidence-ref shape, deterministic record identity and the recorded-time source.
  - Validate CoordinationSignalV1 against an exact key set and content-address it, closing the transport without closing any collaboration vocabulary.
  - Derive the publishing actor from the authenticated Engineer principal and refuse any caller-declared identity.
  - Keep recorded time stable across retries by sampling only on the branch that creates a record and rebuilding a republish from the persisted value.
  - Persist each signal as one immutable content-checked file under a per-thread lock, with an lstat ancestor walk, explicit idempotency conflict and no healthy-empty fallback.
  - Restrict revision to supersede inside one actor lineage and require every reply, source and supersede reference to already resolve in the same repository.
  - Gate every mutation on collaboration.mode, which defaults to off, and perform no write to any delivery-plane store.
  - Own one durable create-once publish protocol and one server-side actor derivation as shared substrate, so each record family is a schema plus a shard name rather than a third copy of the crash-safety rules.
  - Validate WorkStateHandoffV1 with its attempted paths, dead ends, key findings and next actions present, and its execution context complete on exactly one branch of the discriminated union.
  - Record handoff adoption as non-exclusive by identity, keying each receipt on the handoff digest, the adopter actor digest and the context packet digest, so distinct adopters never exclude one another and grant no Task or Lease.
source:
  include:
    - "src/core/collaboration/**"
    - "src/effects/collaboration/**"
  entrypoints:
    - id: entrypoint.collaboration.publish
      path: "src/effects/collaboration/signal-store.ts"
      symbols:
        - name: "publishCoordinationSignal"
          sinks:
            - id: sink.collaboration.mutation-gate
              path: "src/effects/collaboration/feature-flag.ts"
              symbol: "assertCollaborationMutationEnabled"
            - id: sink.collaboration.signal-schema
              path: "src/core/collaboration/signal.ts"
              symbol: "buildCoordinationSignal"
    - id: entrypoint.collaboration.actor-derivation
      path: "src/effects/collaboration/actor.ts"
      symbols:
        - name: "resolveCollaborationActor"
          sinks:
            - id: sink.collaboration.authenticated-principal
              path: "src/effects/engineers/principal.ts"
              symbol: "resolveEngineerPrincipal"
    - id: entrypoint.collaboration.read
      path: "src/effects/collaboration/record-store.ts"
      symbols:
        - name: "readCollaborationRecord"
          sinks:
            - id: sink.collaboration.record-path-guard
              path: "src/effects/collaboration/record-store.ts"
              symbol: "collaborationRecordPath"
    - id: entrypoint.collaboration.durable-publish
      path: "src/effects/collaboration/record-store.ts"
      symbols:
        - name: "publishCollaborationRecordDurably"
          sinks:
            - id: sink.collaboration.staging-name
              path: "src/effects/collaboration/record-store.ts"
              symbol: "collaborationStagingName"
    - id: entrypoint.collaboration.handoff-publish
      path: "src/effects/collaboration/handoff-store.ts"
      symbols:
        - name: "publishWorkStateHandoff"
          sinks:
            - id: sink.collaboration.handoff-mutation-gate
              path: "src/effects/collaboration/feature-flag.ts"
              symbol: "assertCollaborationMutationEnabled"
            - id: sink.collaboration.handoff-schema
              path: "src/core/collaboration/handoff.ts"
              symbol: "buildWorkStateHandoff"
    - id: entrypoint.collaboration.handoff-adoption
      path: "src/effects/collaboration/adoption-store.ts"
      symbols:
        - name: "adoptWorkStateHandoff"
          sinks:
            - id: sink.collaboration.adoption-mutation-gate
              path: "src/effects/collaboration/feature-flag.ts"
              symbol: "assertCollaborationMutationEnabled"
            - id: sink.collaboration.adoption-actor
              path: "src/effects/collaboration/actor.ts"
              symbol: "resolveCollaborationActor"
    - id: entrypoint.collaboration.adoption-identity
      path: "src/core/collaboration/adoption.ts"
      symbols:
        - name: "handoffAdoptionReceiptId"
          sinks:
            - id: sink.collaboration.adoption-triple
              path: "src/core/collaboration/adoption.ts"
              symbol: "deriveHandoffAdoptionReceiptId"
    - id: entrypoint.collaboration.shared-mechanics
      path: "src/core/collaboration/signal.ts"
      symbols:
        - name: "buildCoordinationSignal"
          sinks:
            - id: sink.collaboration.actor-union
              path: "src/core/collaboration/common.ts"
              symbol: "validateCollaborationActorRef"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/collaboration-common.test.ts tests/unit/collaboration-signal.test.ts tests/unit/collaboration-authority-baseline.test.ts tests/effects/collaboration-signal-store.test.ts --timeout 60000"
    - "bun test tests/unit/collaboration-hotspot.test.ts tests/unit/collaboration-thread-projection.test.ts tests/unit/collaboration-context-packet.test.ts --timeout 60000"
    - "bun test tests/unit/collaboration-handoff.test.ts tests/unit/collaboration-adoption.test.ts tests/effects/collaboration-handoff-store.test.ts tests/effects/collaboration-adoption-store.test.ts --timeout 60000"
    - "bun run check:type"
