extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/collaboration-common.test.ts tests/unit/collaboration-signal.test.ts tests/unit/collaboration-authority-baseline.test.ts tests/effects/collaboration-signal-store.test.ts --timeout 60000"
    - "bun test tests/unit/collaboration-hotspot.test.ts tests/unit/collaboration-thread-projection.test.ts tests/unit/collaboration-context-packet.test.ts --timeout 60000"
    - "bun test tests/unit/collaboration-handoff.test.ts tests/unit/collaboration-adoption.test.ts tests/effects/collaboration-handoff-store.test.ts tests/effects/collaboration-adoption-store.test.ts --timeout 60000"
    - "bun test tests/unit/collaboration-contribution.test.ts tests/unit/collaboration-admission.test.ts tests/effects/collaboration-admission-bridge.test.ts tests/effects/collaboration-contribution-collector.test.ts --timeout 180000"
    - "bun test tests/effects/collaboration-succession.test.ts tests/effects/collaboration-work-exchange.test.ts tests/effects/collaboration-context-delivery.test.ts --timeout 180000"
    - "bun test tests/cli/collaboration.test.ts tests/cli/mcp-collaboration-tools.test.ts tests/cli/mcp-engineer-tools.test.ts --timeout 180000"
    - "bun run check:type"
