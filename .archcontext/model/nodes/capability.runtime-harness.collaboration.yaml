    - id: entrypoint.collaboration.run-binding-record
      path: "src/effects/collaboration/context-delivery.ts"
      symbols:
        - name: "recordCollaborationRunContextBinding"
          sinks:
            - id: sink.collaboration.run-binding-build
              path: "src/core/collaboration/run-binding.ts"
              symbol: "buildCollaborationRunContextBinding"
    - id: entrypoint.collaboration.dispatch-fence
      path: "src/effects/collaboration/context-delivery.ts"
      symbols:
        - name: "assertCollaborationDispatchBinding"
          sinks:
