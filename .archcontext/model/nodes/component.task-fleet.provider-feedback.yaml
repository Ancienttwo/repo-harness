summary: Owns admitted provider feedback orchestration and read-only repair projections; it stores feedback facts and delivery receipts through the Publication feedback store.
responsibilities:
  - Observe explicit provider PR identity against the exact current admitted claim before recording immutable manual feedback events.
  - Keep feedback delivery separate from provider issue and admission authority; project repair and no-progress observations without dispatching repairs.
  - Read exact current admitted inbox context and provider readiness through their shared implementations; historical receipts never substitute for current admission.
