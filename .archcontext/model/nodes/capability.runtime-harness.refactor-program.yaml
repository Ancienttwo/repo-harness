schemaVersion: archcontext.node/v2
id: capability.runtime-harness.refactor-program
kind: capability
name: Refactor Recommendations
status: active
summary: Shows measured ArchContext refactor suggestions with their evidence and records the user decision; it never executes a refactor.
responsibilities:
  - Keep ArchContext as the sole authority for structural observations, recommendation identity and lifecycle state.
  - Present each open suggestion with the metrics and module statistics from the scan that produced it.
  - Return suggestions as on-demand evidence for the Bot; no hook scans for them and repo-harness schedules nothing.
  - Record an accept, defer or reject decision with its reason through ArchContext.
source:
  include:
    - "src/core/refactor/**"
    - "src/effects/refactor/**"
    - "src/cli/commands/refactor.ts"
  entrypoints:
    - id: entrypoint.refactor-program.observe
      path: "src/effects/refactor/recommendations.ts"
      symbols:
        - name: "discoverRefactorRecommendations"
          sinks:
            - id: sink.refactor-program.provider-scan
              path: "src/effects/refactor/archctx-provider.ts"
              symbol: "runRefactorScan"
    - id: entrypoint.refactor-program.decide
      path: "src/cli/commands/refactor.ts"
      symbols:
        - name: "decideRefactorRecommendation"
          sinks:
            - id: sink.refactor-program.decision
              path: "src/effects/refactor/archctx-provider.ts"
              symbol: "decideRecommendation"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/refactor-recommendations.test.ts tests/refactor-archctx-provider.test.ts --timeout 60000"
    - "bun run check:type"
