schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.agent-runtime-effects"
kind: "capability"
name: "Agent Runtime Effects"
status: "active"
summary: "Owns admitted session-bound, at-most-once Agent Runtime Effect V2 for the closed Herdr CLI adapter, inbox notification and durable offer wake."
responsibilities:
  - "Validate closed runtime capability, effect intent, Host action, observation and current schemas."
  - "Bind each effect to an exact persisted admitted message or ProviderEngineerOffersV2 snapshot, current admission and claim, session binding digest, transport endpoint and independently selected engineer profile revision."
  - "Arm at most one durable wake per exact admitted endpoint on an empty-to-eligible offer transition, with bounded coalescing and no second concurrent wake."
  - "Refuse a Host action when its exact admitted session, profile, capability observation or authorization fence changed; wake hints grant no task selection or claim authority."
  - "Persist intent and effect_started before admitting at most one closed Host adapter action."
  - "Admit only the herdr-cli-agent adapter; Herdr receives a bounded inbox-control reference and never a message body or generic command."
  - "Treat only an exact persisted inbox receipt as positive delivery evidence for notification and only an exact controller-step receipt bound to the effect control reference for a wake; a process exit code alone is never proof and ambiguous Host outcomes become reconciliation_required without retry or fallback."
  - "Expose due wakes through an effect-level subscription seam a non-interactive controller consumes without the CLI, and permit scheduled polling only under an explicit controller policy flag."
  - "Project delivery and reachability as observations without changing GitHub issue state, claims, publication or acceptance."
  - "Persist admitted-v2 intent, observation and current records in their own namespace; old stores are not active aliases or authority."
  - "Exclude automatic endpoint creation, Agent process ownership, transcript semantics, provider/model routing and implicit or remote terminal routing."
source:
  include:
    - "src/core/engineers/agent-runtime-effect.ts"
    - "src/effects/engineers/agent-runtime-effect-store.ts"
    - "src/effects/engineers/agent-runtime-feature.ts"
    - "src/effects/engineers/agent-runtime-adapters/**"
  entrypoints:
    - id: "entrypoint.agent-runtime-effects.prepare"
      path: "src/effects/engineers/agent-runtime-effect-store.ts"
      symbols:
        - name: "observeAgentRuntimeEndpoint"
          sinks:
            - id: "sink.agent-runtime-effects.current-session"
              path: "src/effects/terminal/task-session-reader.ts"
              symbol: "readTaskAgent"
        - name: "messageDelivery"
          sinks:
            - id: "sink.agent-runtime-effects.persisted-task-message"
              path: "src/effects/fleet/task-inbox.ts"
              symbol: "readTaskMessageDelivery"
    - id: "entrypoint.agent-runtime-effects.wake"
      path: "src/effects/engineers/agent-runtime-effect-store.ts"
      symbols:
        - name: "recordEngineerOfferSnapshot"
          sinks:
            - id: "sink.agent-runtime-effects.offer-wake-decision"
              path: "src/core/engineers/agent-runtime-effect.ts"
              symbol: "decideAgentRuntimeOfferWake"
        - name: "recordAgentRuntimeControllerStep"
          sinks:
            - id: "sink.agent-runtime-effects.controller-step-receipt"
              path: "src/core/engineers/agent-runtime-effect.ts"
              symbol: "buildAgentRuntimeControllerStepReceipt"
    - id: "entrypoint.agent-runtime-effects.start"
      path: "src/effects/engineers/agent-runtime-effect-store.ts"
      symbols:
        - name: "startAgentRuntimeEffect"
          sinks:
            - id: "sink.agent-runtime-effects.started-observation"
              path: "src/core/engineers/agent-runtime-effect.ts"
              symbol: "buildAgentRuntimeEffectObservation"
    - id: "entrypoint.agent-runtime-effects.observe"
      path: "src/effects/engineers/agent-runtime-effect-store.ts"
      symbols:
        - name: "observeAgentRuntimeEffect"
          sinks:
            - id: "sink.agent-runtime-effects.reconciliation-observation"
              path: "src/core/engineers/agent-runtime-effect.ts"
              symbol: "buildAgentRuntimeEffectObservation"
        - name: "messageDelivery"
          sinks:
            - id: "sink.agent-runtime-effects.receipt-evidence"
              path: "src/effects/fleet/task-inbox.ts"
              symbol: "readTaskMessageDelivery"
notes:
  - "Runtime adapters receive only bounded control references. Message and offer evidence stays in its owning store."
  - "Wake is an observation hint and grants no claim, admission or task-selection authority."
  - "Current effects use admitted-v2 storage; historical stores do not establish an endpoint or authorize an action."
extensions:
  contractFiles:
    agents: "src/core/engineers/AGENTS.md"
    claude: "src/core/engineers/CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run test:files tests/unit/r1-provider-neutral-agent-runtime.test.ts tests/unit/r1-agent-runtime-adapters.test.ts tests/unit/issue-281-task-offer-wake.test.ts --timeout 60000"
    - "bun run check:type"
