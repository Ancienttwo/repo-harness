schemaVersion: archcontext.node/v2
id: capability.runtime-harness.agent-runtime-effects
kind: capability
name: Agent Runtime Effects
status: active
summary: Owns the accepted provider-neutral, at-most-once Agent runtime-effect boundary; the current Codex Thread V1 implementation remains the evidence-bearing implementation until R1 replaces it with V2.
responsibilities:
  - Validate closed runtime capability, effect intent, Host action, observation and current schemas.
  - Bind every effect to one exact persisted Task or Module message, one current recipient fence and one current Engineer Binding endpoint.
  - Persist intent and effect_started before admitting at most one closed Host adapter action.
  - Admit only codex-app-thread and tmux-cli-agent adapters; tmux receives a bounded inbox-control reference and never a message body or generic command.
  - Treat only an exact persisted inbox receipt as positive delivery evidence; ambiguous Host outcomes become reconciliation_required without retry or fallback.
  - Project delivery and reachability as read-model facts while leaving Task, Lease, Collaboration, Publication and Acceptance authorities unchanged.
  - Retire the Provider Thread V1 runtime through the R1 terminal-only one-shot migration, with no steady-state alias or dual reader.
  - Exclude automatic endpoint creation, Agent process ownership, transcript semantics, provider/model routing and remote tmux.
source:
  include:
    - "src/core/engineers/provider-thread-effect.ts"
    - "src/effects/engineers/provider-thread-effect-store.ts"
  entrypoints:
    - id: entrypoint.agent-runtime-effects.prepare
      path: "src/effects/engineers/provider-thread-effect-store.ts"
      symbols:
        - name: "assertCurrentBinding"
          sinks:
            - id: sink.agent-runtime-effects.current-binding
              path: "src/effects/engineers/binding-store.ts"
              symbol: "readEngineerBindingStatus"
        - name: "assertPendingMessage"
          sinks:
            - id: sink.agent-runtime-effects.persisted-message
              path: "src/effects/engineers/module-inbox.ts"
              symbol: "readModuleMessageDelivery"
    - id: entrypoint.agent-runtime-effects.start
      path: "src/effects/engineers/provider-thread-effect-store.ts"
      symbols:
        - name: "startProviderThreadEffect"
          sinks:
            - id: sink.agent-runtime-effects.started-observation
              path: "src/core/engineers/provider-thread-effect.ts"
              symbol: "buildProviderThreadEffectObservation"
    - id: entrypoint.agent-runtime-effects.observe
      path: "src/effects/engineers/provider-thread-effect-store.ts"
      symbols:
        - name: "observeProviderThreadEffect"
          sinks:
            - id: sink.agent-runtime-effects.reconciliation-observation
              path: "src/core/engineers/provider-thread-effect.ts"
              symbol: "buildProviderThreadEffectObservation"
        - name: "projectSuccessfulDelivery"
          sinks:
            - id: sink.agent-runtime-effects.delivery-observation
              path: "src/effects/engineers/module-inbox.ts"
              symbol: "recordModuleMessageDeliveryObservation"
notes:
  - The accepted capability identity is Agent Runtime Effects; source selectors intentionally remain on the current V1 files until the approved R1 work package performs the one-shot product rename and migration.
  - Architecture acceptance does not claim that tmux execution or Task Inbox correlation is implemented.
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/me3a-provider-thread-effect.test.ts tests/unit/me1c-module-inbox.test.ts tests/cli/engineer.test.ts tests/cli/mcp-engineer-tools.test.ts --timeout 60000"
    - "bun run check:type"
