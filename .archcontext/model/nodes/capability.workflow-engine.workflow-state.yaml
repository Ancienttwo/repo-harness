schemaVersion: archcontext.node/v2
id: capability.workflow-engine.workflow-state
kind: capability
name: Workflow State
status: active
layer: effects
summary: "Resolves deterministic Effective State, worktree safety and the continuation ledger."
responsibilities:
  - Project repository workflow artifacts into one deterministic Effective State. No local task snapshot is a state authority.
  - Preserve exact worktree cleanup; task mutex ownership belongs to Execution Primitives.
  - Own the continuation envelope and the append-only attempt ledger with its no-progress breaker.
  - Keep src/core/state and src/core/workflow pure. Effects do IO under directory locks.
  - Project state snapshots without local task-file or contract fields. Resolve recovery paths without review or notes directory policy keys.
source:
  include:
    - src/core/state/**
    - src/effects/state/**
    - src/core/workflow/**
    - interfaces/**
    - src/core/worktree-location.mjs
    - src/core/worktree-location.d.mts
    - src/cli/commands/state.ts
  entrypoints:
    - id: entrypoint.workflow-state.primary
      path: src/effects/state/resolve-effective-state.ts
      symbols:
        - name: resolveEffectiveState
          sinks:
            - id: sink.workflow-state.primary
              path: src/effects/state/state-lock.ts
              symbol: withStateLock
        - name: resolveEffectiveStateUnlocked
          sinks:
            - id: sink.workflow-state.project
              path: src/core/state/project-effective-state.ts
              symbol: projectEffectiveState
        - name: resolveAndCommitEffectiveState
          sinks:
            - id: sink.workflow-state.version-commit
              path: src/effects/state/git-state-version-store.ts
              symbol: commitStateVersionAfter
    - id: entrypoint.workflow-state.state-lock
      path: src/effects/state/state-lock.ts
      symbols:
        - name: withStateLock
          sinks:
            - id: sink.workflow-state.directory-lock
              path: src/effects/locking/exclusive-directory-lock.ts
              symbol: withExclusiveDirectoryLock
    - id: entrypoint.workflow-state.version-owner
      path: src/effects/state/git-state-version-store.ts
      symbols:
        - name: commitStateVersionAfter
          sinks:
            - id: sink.workflow-state.git-common-dir
              path: src/effects/git/common-directory.ts
              symbol: resolveGitCommonDirectory
extensions:
  harnessTier: core
  contractFiles:
    agents: AGENTS.md
    claude: CLAUDE.md
  lspProfile: typescript-lsp
  verification:
    - bun run check:type
    - bun run check:state-boundaries
    - bun run test:files tests/state/cli-state-golden.test.ts tests/state/state-concurrency.test.ts tests/state/state-effects.test.ts tests/state/adapter-parity.test.ts tests/effective-state.test.ts tests/coordination-lease-store.test.ts tests/continuation-envelope.test.ts tests/cli/state-command.test.ts --timeout 60000 --max-concurrency 1
