schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.task-agent-host"
kind: "capability"
name: "Task Agent Host"
status: "active"
layer: "effects"
summary: "Hosts persistent task-agent participants in Herdr panes with role profiles, task worktrees, request send, request-bound result collection and OAR runtime observation, and installs the Herdr notify plugin and the agent fleet personas. Records pane-status shadow decisions and blind Bot labels without applying model output."
responsibilities:
  - "Start one persistent task agent per repository, task and role, binding immutable source root, live review admission and exact current claim."
  - "Save each request before delivery and treat a lost response as unknown delivery that is never replayed."
  - "Collect only a request-bound TaskResult validated by the owner and keep history as observation only."
  - "Fold OAR records in the owned hosts with the SDK reducer and expose bounded request-bound snapshots without task acceptance."
  - "Close Herdr workspaces and panes without removing Git checkouts. Run the task worktree register, merge notice and cleanup actions as a process entry for the contract worktree runtime."
  - "Install the shipped Herdr notify plugin, the release-matched Herdr skill and the fleet persona definitions."
  - "Record bounded, redacted Clef shadow decisions after Herdr notification delivery and store blind Bot labels without changing notification routing or agent status."
  - "Treat pane and request state as runtime evidence; it never determines canonical GitHub issue status or task acceptance."
  - "Bind native host session attribution to the exact immutable task binding; native attribution never grants admission."
  - "Provide the one reviewer runner for acceptance review and its OAR review host. Apply the review isolation policy that review passes as data, and refuse a session that the host cannot isolate."
  - "Reserve bounded pre-prompt inbox companions without delivery. The Node-safe host consumer validates and reads context; only exact accepted OAR proof permits the owner to commit existing inbox delivery receipts."
source:
  include:
    - src/effects/terminal/herdr.ts
    - src/effects/terminal/task-session.ts
    - src/effects/terminal/task-runtime-observation.ts
    - assets/herdr/**
    - agents/fleet/**
    - .codex/agents/**
    - scripts/install-agent-fleet.sh
    - src/effects/terminal/herdr-decision.ts
    - src/effects/terminal/native-task-session.ts
    - src/effects/review-runner/**
  entrypoints:
    - id: "entrypoint.task-agent-host.session"
      path: "src/effects/terminal/task-session.ts"
      symbols:
        - name: "startTaskApplicationHost"
          sinks:
            - id: "sink.task-agent-host.start"
              path: "src/effects/terminal/task-session.ts"
              symbol: "startTaskAgent"
        - name: "sendTaskRequest"
          sinks:
            - id: "sink.task-agent-host.send"
              path: "src/effects/terminal/task-session-io.ts"
              symbol: "nextSessionRound"
        - name: "collectTaskResult"
          sinks:
            - id: "sink.task-agent-host.collect"
              path: "src/effects/terminal/task-session.ts"
              symbol: "readTaskRequestResult"
    - id: "entrypoint.task-agent-host.review-runner"
      path: "src/effects/review-runner/task-review-runner.ts"
      symbols:
        - name: "send"
          sinks:
            - id: "sink.task-agent-host.reserve-inbox"
              path: "src/effects/review-runner/task-pre-prompt-inbox.ts"
              symbol: "preparePrePromptInbox"
        - name: "settleCompanion"
          sinks:
            - id: "sink.task-agent-host.commit-inbox"
              path: "src/effects/review-runner/task-pre-prompt-inbox.ts"
              symbol: "commitPrePromptInbox"
        - name: "recoverCompanions"
          sinks:
            - id: "sink.task-agent-host.recover-inbox"
              path: "src/effects/review-runner/task-pre-prompt-inbox.ts"
              symbol: "commitPrePromptInbox"
    - id: "entrypoint.task-agent-host.inbox-host"
      path: "src/effects/review-runner/task-oar-host.ts"
      symbols:
        - name: "runHostFileRequest"
          sinks:
            - id: "sink.task-agent-host.consume-inbox"
              path: "src/effects/review-runner/task-pre-prompt-inbox-consumer.ts"
              symbol: "consumePrePromptInbox"
            - id: "sink.task-agent-host.accepted-inbox"
              path: "src/effects/review-runner/task-pre-prompt-inbox-consumer.ts"
              symbol: "recordPrePromptInboxAccepted"
    - id: "entrypoint.task-agent-host.inbox-proof"
      path: "src/effects/review-runner/task-pre-prompt-inbox-consumer.ts"
      symbols:
        - name: "recordPrePromptInboxAccepted"
          sinks:
            - id: "sink.task-agent-host.persist-inbox-proof"
              path: "src/effects/terminal/task-session-io.ts"
              symbol: "writeSessionArtifact"
    - id: "entrypoint.task-agent-host.inbox-commit"
      path: "src/effects/review-runner/task-pre-prompt-inbox.ts"
      symbols:
        - name: "commitPrePromptInbox"
          sinks:
            - id: "sink.task-agent-host.inbox-session"
              path: "src/effects/terminal/task-session-record.ts"
              symbol: "readTaskAgent"
            - id: "sink.task-agent-host.inbox-oar-proof"
              path: "src/effects/terminal/task-runtime-observation.ts"
              symbol: "readOarObservation"
            - id: "sink.task-agent-host.deliver-inbox"
              path: "src/effects/fleet/task-inbox.ts"
              symbol: "deliverTaskInbox"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run test:files tests/herdr-transport.test.ts tests/herdr-task-lifecycle.test.ts tests/herdr-runtime-pin.test.ts tests/install-agent-fleet.test.ts tests/effects/native-task-session.test.ts tests/effects/oar-host-node-import.test.ts --timeout 60000 --max-concurrency 1"
    - "bun run check:type"
