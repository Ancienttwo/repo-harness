schemaVersion: archcontext.node/v2
id: component.task-agent-host.primary
kind: component
name: Herdr Task Session Host
status: active
parent: capability.runtime-harness.task-agent-host
layer: effects
summary: "Owns the hc transport, task sessions in hc terminals, task worktrees, the Herdr commands, the installed persona assets, and the notify relay with its install record. Sends post-merge closeout notices to dispatch-attributed owner terminals through existing workspace bindings without granting Git deletion authority."
source:
  include:
    - src/effects/terminal/herdr.ts
    - src/effects/terminal/herdr-core.ts
    - src/effects/terminal/task-*.ts
    - .codex/agents/**
    - src/effects/terminal/herdr-notify-install.ts
    - src/effects/terminal/notify-relay.ts
  exclude:
    - src/effects/terminal/task-session-io.ts
    - src/effects/terminal/task-role-profiles.ts
    - src/effects/terminal/task-session-record.ts
    - src/effects/terminal/task-session-admission.ts
