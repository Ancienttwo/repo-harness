schemaVersion: archcontext.node/v2
id: component.operator.docs-host-isolation
kind: component
name: Docs Host Isolation
status: active
parent: capability.runtime-harness.operator
layer: effects
summary: Keeps the docs host platform check and the protected projection paths that operator doc sessions use while the docs host is closed (#1149).
responsibilities:
  - Refuse a docs host on any platform other than darwin.
  - List the projection manifest path, its generated targets and their docs/ parent directories as protected paths, and refuse a symlink on a protected path under docs/ (a protected path outside docs/ gets no symlink check).
source:
  include:
    - src/effects/review/docs-host-isolation.ts
