schemaVersion: archcontext.node/v2
id: component.hook-adapters.edit-guards
kind: component
name: "Guard and Observer Handlers"
status: active
parent: capability.runtime-harness.hook-adapters
summary: "Typed handlers that guard edits, observe shell commands and give prompt advice."
responsibilities:
  - Decide PreToolUse.edit with the mutation guard from the repository, _ref, _ops and target path boundaries.
  - Observe Bash results, count known test failures in the repair circuit and report owed architecture updates after publication commands.
  - Give bounded prompt advice and keep the circuit breaker and the minimal change policy text.
source:
  include:
    - "src/cli/hook/mutation-*.ts"
    - "src/cli/hook/minimal-*.ts"
    - "src/cli/hook/prompt-*.ts"
    - "src/cli/hook/circuit-breaker.ts"
    - "src/cli/hook/command-observed.ts"
