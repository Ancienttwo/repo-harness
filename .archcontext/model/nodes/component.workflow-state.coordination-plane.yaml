schemaVersion: "archcontext.node/v2"
id: "component.workflow-state.coordination-plane"
kind: "component"
name: "Provider Board Observations and Historical Worktree Safety"
status: "active"
parent: "capability.workflow-engine.workflow-state"
layer: "effects"
summary: "Joins provider issue observations and exact admitted sessions, retains historical canonical task parsers and guards exact worktree cleanup."
responsibilities:
  - "Project provider boards by exact canonical REST repository and issue identities; preserve all admitted session bindings and typed unavailable rows."
  - "Compare complete board revisions with bounded rereads without task locks or mutation."
  - "Supply hooks with the newest bounded provider observation snapshot named by the receipt head, without network or session discovery; a missing or stale head yields no slice."
  - "Own task session admission: observe the approval of a task session and recheck that one admitted session is current. Each caller passes its own refusal."
  - "Own the shared closed admitted-session selector, bounded readAdmittedTaskSessions discovery and observeAdmittedSessionSource revalidation; HTTP is an operator consumer, not the session contract owner."
  - "Retain historical canonical task parsing, worktree topology, sweep and exact deletion guards. Historical leases and claim tokens are not current authority."
source:
  include:
    - src/effects/state/coordination-*.ts
    - src/effects/state/collect-slice-inputs.ts
    - src/effects/state/pruned-worktree-intents.ts
    - src/effects/state/worktree-trash.ts
    - src/effects/state/collect-provider-board-inputs.ts
    - src/effects/state/canonical-target.ts
    - src/effects/terminal/task-session-admission.ts
    - src/effects/sessions/admitted-source.ts
    - src/effects/sessions/task-sessions.ts
