name: "Provider Board Observations and Historical Worktree Safety"
status: "active"
parent: "capability.workflow-engine.workflow-state"
summary: "Joins provider issue observations and exact admitted sessions, retains historical canonical task parsers and guards exact worktree cleanup."
responsibilities:
  - "Project provider boards by exact canonical REST repository and issue identities; preserve all admitted session bindings and typed unavailable rows."
  - "Compare complete board revisions with bounded rereads without task locks or mutation."
  - "Supply hooks with stored local provider observations and explicitly supplied admitted session context; absent trusted self context remains unobserved without network discovery."
  - "Retain historical canonical task and claim-token parsing, worktree topology, sweep and exact deletion guards; never use historical leases as current authority."
