schemaVersion: archcontext.node/v2
id: component.operator.primary
kind: component
name: Operator HTTP Reader
status: active
parent: capability.runtime-harness.operator
layer: effects
summary: Returns public JSON observations and typed failures; its write routes change settings, send advisor seat messages and remove green worktrees.
responsibilities:
  - Accept GET and HEAD from a loopback Host and same-origin callers; accept POST only with this service's Origin and Sec-Fetch-Site same-origin, and only on a declared write route; refuse every other method with 405.
  - Route each path through the frozen OPERATOR_ROUTES list; each production write route, for example settings_agents_write, which changes only the agents section of ~/.repo-harness/config.json, and worktrees_cleanup, which removes green worktrees, is an inventory entry with method POST and write true; the server refuses to start unless each write handler and each inventory entry with method POST and write true match.
  - Own the green worktree cleanup effect shared by POST /api/v1/worktrees/cleanup and repo-harness worktrees clean: refuse the whole selection when a row is unknown, in use, not green or its selection digest changed; then remove each row through the sweep's green path, which checks the row again inside the topology barrier. HTTP runs the effect in a supervised child process; the CLI runs it in its own process; both go through the shared write run. Remote branches are never touched.
  - Run slow reads in supervised worker processes and start background collectors once per server.
  - Serve the Bot access, Dot review, CLI inventory, notify status, docs, tests and task execution GET routes only from collector caches; a docs file GET sends one object request, under a concurrency cap and a deadline, to the resident cat-file worker of the docs collector and never starts or restarts it.
  - Own the operator serve and runtime capture CLI entry and the hc runtime transport: hc server status, the task-session hc events snapshot and the runtime capture stream.
  - Serve saved finalization journal progress through bounded HTTP and CLI reads after session identity and repository registration admission; preserve reads after worktree removal, omit private journal fields and make no inference about live write capability or audited completion.
source:
  include:
    - src/effects/operator/**
    - assets/operator/**
    - specs/tla/BossCommandSend.tla
    - specs/tla/BossCommandSend.cfg
    - specs/tla/BossCommandSend.unresolved-not-counted.cfg
    - specs/tla/BossCommandSend.reconcile-not-counted.cfg
    - specs/tla/BossCommandSend.no-request-lookup.cfg
    - specs/tla/check.sh
    - specs/tla/checks.tsv
    - .claude/skills/verify-boss-command/SKILL.md
  exclude:
    - src/effects/operator/board-observer.ts
    - src/effects/operator/board-observer-worker.ts
    - src/effects/operator/bot-access.ts
    - src/effects/operator/notify-collector.ts
    - src/effects/operator/slack-review-collector.ts
    - src/effects/operator/notify-status.ts
    - src/effects/operator/docs-collector.ts
    - src/effects/operator/docs-reader.ts
    - src/effects/operator/tests-collector.ts
    - src/effects/operator/execution-collector.ts
    - src/effects/operator/execution-state-worker.ts
    - src/effects/operator/execution-state.ts
    - src/effects/operator/worktree-collector.ts
    - src/effects/operator/worktree-collector-worker.ts
    - src/effects/operator/worktree-orphans-worker.ts
    - src/effects/operator/architecture-map-collector.ts
    - src/effects/operator/architecture-map-worker.ts
  entrypoints:
    - id: entrypoint.operator.http-server
      path: src/effects/operator/server.ts
      symbols:
        - name: startOperatorServer
          sinks:
            - id: sink.operator.dev-activity-collector
              path: src/effects/dev-activity/collector.ts
              symbol: startDevActivityCollector
            - id: sink.operator.notify-collector
              path: src/effects/operator/notify-collector.ts
              symbol: startNotifyCollector
            - id: sink.operator.bot-access-collector
              path: src/effects/operator/bot-access.ts
              symbol: startBotAccessCollector
            - id: sink.operator.slack-review-collector
              path: src/effects/operator/slack-review-collector.ts
              symbol: startSlackReviewCollector
            - id: sink.operator.docs-collector
              path: src/effects/operator/docs-collector.ts
              symbol: startDocsCollector
            - id: sink.operator.tests-collector
              path: src/effects/operator/tests-collector.ts
              symbol: startTestsCollector
            - id: sink.operator.execution-collector
              path: src/effects/operator/execution-collector.ts
              symbol: startExecutionCollector
            - id: sink.operator.architecture-map-collector
              path: src/effects/operator/architecture-map-collector.ts
              symbol: startArchitectureMapCollector
            - id: sink.operator.cli-inventory-collector
              path: src/effects/setup/cli-inventory.ts
              symbol: startCliInventoryCollector
        - name: handleRequest
          sinks:
            - id: sink.operator.dev-activity-decode
              path: src/core/dev-activity/decode.ts
              symbol: decodeDevActivitySnapshot
            - id: sink.operator.dev-activity-unavailable
              path: src/core/dev-activity/decode.ts
              symbol: unavailableDevActivitySnapshot
            - id: sink.operator.architecture-request
              path: src/core/operator/architecture.ts
              symbol: parseArchitectureRequest
extensions:
  behaviorSpecs:
    - id: boss-command-send
      path: specs/tla/BossCommandSend.tla
