schemaVersion: archcontext.node/v2
id: component.operator.primary
kind: component
name: Operator HTTP Reader
status: active
parent: capability.runtime-harness.operator
layer: effects
summary: Returns public JSON observations and typed failures; its seven write routes change the agents section of the global configuration, create doc sessions, send follow-ups, stop a doc session's turn, admit commit/discard with a required quiescence check, and remove green worktrees.
responsibilities:
  - Accept GET and HEAD from a loopback Host and same-origin callers; accept POST only with this service's Origin and Sec-Fetch-Site same-origin, and only on a declared write route; refuse every other method with 405.
  - Route each path through the frozen OPERATOR_ROUTES list; production declares seven write routes, settings_agents_write, which changes only the agents section of ~/.repo-harness/config.json, sessions_create, sessions_messages, sessions_commit, sessions_discard, sessions_stop, and worktrees_cleanup, which removes green worktrees; the server refuses to start unless each write handler and each inventory entry with method POST and write true match.
  - Own the green worktree cleanup effect shared by POST /api/v1/worktrees/cleanup and repo-harness worktrees clean: refuse the whole selection when a row is unknown, in use, not green or its selection digest changed; then remove each row through the sweep's green path, which checks the row again inside the topology barrier. HTTP runs the effect in a supervised child process; the CLI runs it in its own process; both go through the shared write run. Remote branches are never touched.
  - Run slow reads in supervised worker processes and start background collectors once per server.
  - Serve the Bot access, CLI inventory, notify status, docs, tests and task execution GET routes only from collector caches; a docs file GET sends one object request, under a concurrency cap and a deadline, to the resident cat-file worker of the docs collector and never starts or restarts it.
  - Own the operator serve and runtime capture CLI entry and the Herdr observation transport.
  - Own the doc session creation operation: refuse a runtime without verified docs isolation or without the docs use, verify each citation against one commit of the served docs view, then create the session's docs/<slug> branch and worktree under the managed worktree root and its session record — the production sessions_create route runs it after the local config write (#1017) opened — and start the session's agent.
  - Own the doc session agent lifecycle: start one detached docs host per session with a new environment, create agent.json as the sole lifecycle authority, plan the session's control directory under the per-user OS temp root outside the repo-harness home, pass stop and cancel requests as files, and for a host that died, at its exit or at the next server start, remove the credential copy and publish the failed state first, then record runtime_error and the end of an open turn; a log that refuses them is kept and the refusal is recorded. The docs host (oar-docs-host.ts) runs the OAR runtime only inside the docs host boundary, maps OAR events to doc session records, acknowledges a stop only when the runtime accepts the interrupt, applies the start, turn, idle and lifetime bounds (a turn whose interrupt is refused or does not end it ends the runtime as timeout), and removes the credential copy on every exit path; a boundary that cannot be built fails the session with boundary_denied.
  - Deliver doc session follow-ups through the same audited target lock in HTTP and CLI; bind host requests and acknowledgements to the current epoch, report prompt, queue or steer only after acceptance, never turn an unsupported steer into a queue, and keep an unknown acknowledgement unresolved for manual reconciliation.
  - Resume only an idle-disposed doc session with a recorded native identity and removed credential copy; claim the next epoch under agent.lock, retain the same private runtime history, rebuild immutable per-epoch boundary artifacts, and copy fresh model credentials. Only the audited messages operation requests resume; reads, commit and discard do not. A failed resume keeps an unresolved audit intent and never replays the creation prompt.
  - Compose doc session commit and discard through the same audited session target lock and a bounded child with private stdin; reuse the existing finalization journal, GitHub adapters and host scope policy. The production quiescence adapter refuses before mutations until the runtime supplies verified complete cleanup. Unknown child outcomes remain unresolved and cannot replay. Serve finalization availability and the safe journal projection through bounded HTTP and CLI reads after session identity and repository registration admission; preserve reads after worktree removal, omit private journal fields and make no inference about live write capability or audited completion.
  - Own the doc session event log: append redacted, schema-checked events to the session's events.jsonl under a per-session lock, each one moving the epoch.seq cursor forward, take over the lock of a writer that is proven dead, and serve the production cursor read through the bounded task-read process.
  - Serve the public doc session list and detail from persisted session, host and redacted event records through the bounded task-read process; expose only safe metadata, branch, worktree directory name and HEAD, and compare browser-provided read cursors without persisting browser state.
source:
  include:
    - src/effects/operator/**
    - assets/operator/**
    - src/effects/terminal/herdr-observation.ts
  exclude:
    - src/effects/operator/bot-access.ts
    - src/effects/operator/notify-collector.ts
    - src/effects/operator/notify-status.ts
    - src/effects/operator/docs-collector.ts
    - src/effects/operator/docs-reader.ts
    - src/effects/operator/tests-collector.ts
    - src/effects/operator/execution-collector.ts
    - src/effects/operator/execution-state-worker.ts
    - src/effects/operator/execution-state.ts
    - src/effects/operator/worktree-collector.ts
    - src/effects/operator/worktree-collector-worker.ts
    - src/effects/operator/worktree-orphans-worker.ts
    - src/effects/operator/architecture-map-collector.ts
    - src/effects/operator/architecture-map-worker.ts
  entrypoints:
    - id: entrypoint.operator.http-server
      path: src/effects/operator/server.ts
      symbols:
        - name: startOperatorServer
          sinks:
            - id: sink.operator.dev-activity-collector
              path: src/effects/dev-activity/collector.ts
              symbol: startDevActivityCollector
            - id: sink.operator.notify-collector
              path: src/effects/operator/notify-collector.ts
              symbol: startNotifyCollector
            - id: sink.operator.bot-access-collector
              path: src/effects/operator/bot-access.ts
              symbol: startBotAccessCollector
            - id: sink.operator.docs-collector
              path: src/effects/operator/docs-collector.ts
              symbol: startDocsCollector
            - id: sink.operator.tests-collector
              path: src/effects/operator/tests-collector.ts
              symbol: startTestsCollector
            - id: sink.operator.execution-collector
              path: src/effects/operator/execution-collector.ts
              symbol: startExecutionCollector
            - id: sink.operator.architecture-map-collector
              path: src/effects/operator/architecture-map-collector.ts
              symbol: startArchitectureMapCollector
            - id: sink.operator.cli-inventory-collector
              path: src/effects/setup/cli-inventory.ts
              symbol: startCliInventoryCollector
        - name: handleRequest
          sinks:
            - id: sink.operator.dev-activity-decode
              path: src/core/dev-activity/decode.ts
              symbol: decodeDevActivitySnapshot
            - id: sink.operator.dev-activity-unavailable
              path: src/core/dev-activity/decode.ts
              symbol: unavailableDevActivitySnapshot
            - id: sink.operator.architecture-request
              path: src/core/operator/architecture.ts
              symbol: parseArchitectureRequest
