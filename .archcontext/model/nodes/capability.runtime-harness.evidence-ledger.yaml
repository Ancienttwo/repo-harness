schemaVersion: archcontext.node/v2
id: capability.runtime-harness.evidence-ledger
kind: capability
name: Evidence Ledger
status: active
layer: effects
summary: Appends and folds the per-worktree harness evidence event log, stores write-once blobs and checkpoints, and imports attested evidence.
responsibilities:
  - Require a genesis record before the first append and build every event through the single writer construction path.
  - Fold accepted events in append order with idempotency deduplication and supersession and truncate a corrupt tail into quarantine under the log lock.
  - Store content-addressed write-once blobs and redact secrets by construction before persistence.
  - Publish validated checkpoints atomically and resolve them only through the last-published marker.
  - Import attested receipts only through the closed trust mapping.
  - Execute the Verification Plan of the current review admission and catalog evals, and record execution facts until the verification-plan split after arch-context#296.
source:
  include:
    - src/core/evidence/**
    - src/effects/evidence/**
  entrypoints:
    - id: entrypoint.evidence-ledger.attested-import
      path: "src/effects/evidence/attested-import.ts"
      symbols:
        - name: "importAttestedEvidence"
          sinks:
            - id: sink.evidence-ledger.append
              path: "src/effects/evidence/event-log.ts"
              symbol: "appendEvidenceEvent"
    - id: entrypoint.evidence-ledger.checkpoint
      path: "src/effects/evidence/checkpoint-store.ts"
      symbols:
        - name: "publishCheckpointFromLedger"
          sinks:
            - id: sink.evidence-ledger.accepted-events
              path: "src/effects/evidence/event-log.ts"
              symbol: "readAcceptedEvents"
    - id: entrypoint.evidence-ledger.log-read
      path: "src/effects/evidence/event-log.ts"
      symbols:
        - name: "readLogSnapshot"
          sinks:
            - id: sink.evidence-ledger.corrupt-tail
              path: "src/core/evidence/fold.ts"
              symbol: "findCorruptTail"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run test:files tests/evidence-event-store.test.ts tests/evidence-checkpoint.test.ts tests/evidence-blob-store.test.ts tests/evidence-attested-import.test.ts tests/evidence-replay-recovery.test.ts tests/evidence-projection-drift.test.ts --timeout 60000 --max-concurrency 1"
    - "bun run check:type"
