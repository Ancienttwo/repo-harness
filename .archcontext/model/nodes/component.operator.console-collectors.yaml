schemaVersion: archcontext.node/v2
id: component.operator.console-collectors
kind: component
name: Console Collectors
status: active
parent: capability.runtime-harness.operator
layer: effects
summary: Background collectors for the Bot access, notify status, docs, tests, task execution, worktree and architecture map views, with the map's layers; each keeps an in-memory cache that a GET reads.
responsibilities:
  - Own the Herdr notify probes in one notify collector; the notify route and the Bot access collector read its cache, and a failed probe is unavailable with a reason code.
  - Collect Bot access from the MCP doctor, the Bot registry, the OAuth token store, the repository registry, the newest audit rows and Herdr status; the first cycle starts after the first notify cycle.
  - Own one resident git cat-file worker for each registered repository that resolves to exactly one GitHub remote and a valid remote-tracking ref of the GitHub default branch; build and hash the docs listing each cycle, read local refs only and never fetch or write.
  - Read the newest completed daily CI run of the GitHub default branch with gh, download its JUnit and test projection artifacts of the highest attempt into the repo-harness home only for a new run, parse them into memory and delete the older download.
  - Take each repository's GitHub name and default branch only from the Dev Activity cache; a missing name is unavailable with a reason code.
  - Collect the task execution state of every registered repository in one child process through the setup collector's supervised runner, whose process group the deadline and server close kill, with the repository-selecting git variables removed; a session is verified only when its binding hash, native session record and process identity agree and it has no closed record, and a failed, timed-out or thrown cycle makes every repository unavailable.
  - Collect worktree topology, lifecycle records, merge proof, process cwd and low-frequency disk sizes in bounded child processes. Use the sweep predicate for the three-color judgment and expose only opaque ids, basenames and validated public facts.
  - Collect each registered repository's architecture map in one child process through the setup collector's supervised runner. Read the committed model and decisions from archctx export native, tracked text-file line counts from git, their owners from archctx resolve and capability import counts from archctx deps. Use git to select today's first-parent commits and archctx impact --base/--head for changed paths, owners, dependents and the model delta. Read each open pull request's impact with archctx impact --paths-from; its changed files come from the Dev Activity cache through a private temporary file. Flow steps use the worktree CodeGraph index; archctx binds its facts to the requested commit or reports unknown. Read violations from archctx debt, docs anchors, flows check --no-sync and the undeclared rows of archctx deps. The flow check reads a private snapshot and does not sync or write the index. An edited model, dirty tree, checkout change or missing, partial or other-commit index makes facts that depend on it unavailable with a reason code; the collector builds no index. The tests layer comes from the tests collector cache in the server process.
source:
  include:
    - src/effects/operator/bot-access.ts
    - src/effects/operator/notify-collector.ts
    - src/effects/operator/notify-status.ts
    - src/effects/operator/docs-collector.ts
    - src/effects/operator/docs-reader.ts
    - src/effects/operator/tests-collector.ts
    - src/effects/operator/execution-collector.ts
    - src/effects/operator/execution-state-worker.ts
    - src/effects/operator/execution-state.ts
    - src/effects/operator/worktree-collector.ts
    - src/effects/operator/worktree-collector-worker.ts
    - src/effects/operator/worktree-orphans-worker.ts
    - src/effects/operator/architecture-map-collector.ts
    - src/effects/operator/architecture-map-worker.ts
