schemaVersion: archcontext.node/v2
id: component.operator.activity-feeds
kind: component
name: Setup and Activity Feeds
status: active
parent: capability.runtime-harness.operator
layer: core
summary: Background collectors and projections for the development activity board and the setup pages.
responsibilities:
  - Collect Git worktrees, the user's GitHub pull requests and runtime source health into one development activity snapshot.
  - Run the setup check builder in a child process with a deadline and keep the last good setup snapshot.
  - Keep a failed source local to its own repository or check, with a fixed reason code.
  - Collect the CLI inventory from read-only package manager listings, agent command use in hook telemetry, and cached gh and npm registry lookups; a present manager whose listing fails keeps the last good inventory as stale.
  - Serve the Dev Activity cache, with each repository's GitHub name and default branch, to the docs and tests collectors.
source:
  include:
    - src/core/setup/**
    - src/effects/setup/**
    - src/cli/commands/setup-*.ts
    - src/core/dev-activity/**
    - src/effects/dev-activity/**
