schemaVersion: archcontext.node/v2
id: capability.verification.evals-checks
kind: capability
name: Evals And Checks
status: active
summary: Runs repository verification, contract gates, benchmarks, and evaluation suites.
responsibilities:
  - Own machine-verifiable checks, bounded verifier execution, and evaluation evidence.
  - Own the test suite, CI coverage selection and the CI report.
  - Own the workflow gate scripts that check task sync, task workflow and agent tooling.
source:
  include:
    - "tests/**"
    - "evals/**"
    - "scripts/run-skill-evals.ts"
    - "scripts/run-harness-profile-benchmark.ts"
    - "scripts/validate-harness-profile-benchmark.ts"
    - "scripts/run-bounded-verifier-command.ts"
    - "scripts/verify-contract.sh"
    - "scripts/verify-sprint.sh"
    - "scripts/check-task-workflow.sh"
    - "scripts/check-task-sync.sh"
    - "scripts/check-agent-tooling.sh"
    - "scripts/check-brain-manifest.sh"
    - "scripts/sync-brain-docs.sh"
    - "bunfig.toml"
    - ".github/**"
    - "scripts/test-file-durations.json"
    - "scripts/verification-plan.ts"
    - "scripts/migrate-verification-plan.ts"
    - "scripts/check-ci.sh"
    - "scripts/select-ci-coverage.ts"
    - "scripts/replay-ci-coverage.ts"
    - "scripts/report-ci.ts"
    - "scripts/select-test-suite.ts"
    - "scripts/ci-documentation-consumers.ts"
    - "scripts/harness-trace-grade.sh"
  entrypoints:
    - id: entrypoint.evals-checks.primary
      path: "src/effects/evidence/verification-execution.ts"
      symbols:
        - name: "executeVerificationContract"
          sinks:
            - id: sink.evals-checks.primary
              path: "src/effects/evidence/verification-execution.ts"
              symbol: "executeCheck"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test"
    - "bash scripts/check-task-sync.sh"
    - "bash scripts/check-task-workflow.sh"
