schemaVersion: archcontext.node/v2
id: component.execution-primitives.public-projections
kind: component
name: Public Text and Worktree Views
status: active
parent: capability.workflow-engine.execution-primitives
layer: core
summary: Holds the public text filter, the worktree view types that Git worktree records, coordination topology and the operator read, and the MCP audit log path.
responsibilities:
  - Own the public text and repository path filters that core projections and the operator use.
  - Own the repository-relative MCP audit log path that the MCP sidecar writes and the operator reads.
  - Own the worktree source, reason, lifecycle and view types and the strict worktrees snapshot decoder.
source:
  include:
    - src/core/public-projections/**
