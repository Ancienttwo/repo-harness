schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.integration-acceptance"
kind: "capability"
name: "Integration Product Acceptance"
status: "active"
layer: "cli"
summary: "Binds approved requirement bytes, explicit canonical provider PR integration proofs, one exact Git candidate, evidence and the canonical acceptance receipt into immutable V2 product projections."
responsibilities:
  - "Validate IntegrationContractV2, IntegrationEnvelopeV2, AcceptanceMatrixV2 and ProductAcceptanceProjectionV2 with exact canonical digests and preserved PRD, source-spec and constraint inputs."
  - "Select explicit canonical REST repository and issue identities plus PR numbers, exact expected head/base and actual provider merge commit/tree evidence; multiple PRs may serve one issue."
  - "Prove each actual merge commit and tree locally, including selected-base ancestry and containment in the exact final candidate; MERGED state alone is never integration proof and squash does not require feature-head ancestry."
  - "Reobserve provider selections and approved requirement bytes around envelope construction; preserve exact evidence and all acceptance receipt inputs with post-async reobservation."
  - "Reuse the canonical acceptance receipt as the product verdict and persist only immutable non-authoritative projections; never construct merges or substitute legacy publication hashes or latest records."
source:
  include:
    - "src/core/integration/product-acceptance.ts"
    - "src/effects/integration/product-acceptance.ts"
    - "src/cli/commands/integration.ts"
  entrypoints:
    - id: "entrypoint.integration-acceptance.contract"
      path: "src/effects/integration/product-acceptance.ts"
      symbols:
        - name: "createIntegrationContract"
          sinks:
            - id: "sink.integration-acceptance.contract-schema"
              path: "src/core/integration/product-acceptance.ts"
              symbol: "buildIntegrationContract"
    - id: "entrypoint.integration-acceptance.envelope"
      path: "src/effects/integration/product-acceptance.ts"
      symbols:
        - name: "observeSelectedPullRequest"
          sinks:
            - id: "sink.integration-acceptance.local-merge-tree"
              path: "src/effects/integration/product-acceptance.ts"
              symbol: "treeForCommit"
            - id: "sink.integration-acceptance.local-ancestry"
              path: "src/effects/integration/product-acceptance.ts"
              symbol: "assertAncestor"
        - name: "buildCurrentEnvelope"
          sinks:
            - id: "sink.integration-acceptance.envelope-schema"
              path: "src/core/integration/product-acceptance.ts"
              symbol: "buildIntegrationEnvelope"
    - id: "entrypoint.integration-acceptance.publication-observation"
      path: "src/effects/integration/product-acceptance.ts"
      symbols:
        - name: "observeSelectedPullRequest"
          sinks:
            - id: "sink.integration-acceptance.provider-integration"
              path: "src/effects/publication/merge-readiness.ts"
              symbol: "collectPullRequestIntegration"
    - id: "entrypoint.integration-acceptance.matrix"
      path: "src/effects/integration/product-acceptance.ts"
      symbols:
        - name: "createAcceptanceMatrix"
          sinks:
            - id: "sink.integration-acceptance.matrix-schema"
              path: "src/core/integration/product-acceptance.ts"
              symbol: "assertCompletePassingMatrix"
    - id: "entrypoint.integration-acceptance.product"
      path: "src/effects/integration/product-acceptance.ts"
      symbols:
        - name: "createProductAcceptanceProjection"
          sinks:
            - id: "sink.integration-acceptance.product-schema"
              path: "src/core/integration/product-acceptance.ts"
              symbol: "buildProductAcceptanceProjection"
    - id: "entrypoint.integration-acceptance.product-command"
      path: "src/cli/commands/integration.ts"
      symbols:
        - name: "buildIntegrationCommand"
          sinks:
            - id: "sink.integration-acceptance.product-operation"
              path: "src/effects/integration/product-acceptance.ts"
              symbol: "createProductAcceptanceProjection"
    - id: "entrypoint.integration-acceptance.contract-canonical"
      path: "src/core/integration/product-acceptance.ts"
      symbols:
        - name: "buildIntegrationContract"
          sinks:
            - id: "sink.integration-acceptance.contract-canonical"
              path: "src/core/publication/publication-receipt.ts"
              symbol: "stablePublicationJson"
    - id: "entrypoint.integration-acceptance.envelope-canonical"
      path: "src/core/integration/product-acceptance.ts"
      symbols:
        - name: "buildIntegrationEnvelope"
          sinks:
            - id: "sink.integration-acceptance.envelope-canonical"
              path: "src/core/publication/publication-receipt.ts"
              symbol: "stablePublicationJson"
    - id: "entrypoint.integration-acceptance.matrix-canonical"
      path: "src/core/integration/product-acceptance.ts"
      symbols:
        - name: "buildAcceptanceMatrix"
          sinks:
            - id: "sink.integration-acceptance.matrix-canonical"
              path: "src/core/publication/publication-receipt.ts"
              symbol: "stablePublicationJson"
    - id: "entrypoint.integration-acceptance.product-canonical"
      path: "src/core/integration/product-acceptance.ts"
      symbols:
        - name: "buildProductAcceptanceProjection"
          sinks:
            - id: "sink.integration-acceptance.product-canonical"
              path: "src/core/publication/publication-receipt.ts"
              symbol: "stablePublicationJson"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/me4c-integration-product-acceptance.test.ts tests/cli/integration.test.ts --timeout 60000"
    - "bun run check:type"
