schemaVersion: archcontext.node/v2
id: component.global-runtime-reconciliation.cli-root
kind: component
name: CLI Composition Root
status: active
parent: capability.runtime-harness.global-runtime-reconciliation
layer: cli
summary: Builds the repo-harness command tree from the core and plugin command modules and runs the update transactions.
responsibilities:
  - Register every top-level command module in one commander program.
  - Parse the mcp commands, load the mcp serve and doctor actions by dynamic import and set repository access grants for mcp access set.
  - Parse the operator, worktrees and catch-up commands and load their actions by dynamic import after the plugin guard.
  - Guard review round, status, close and cancel, herdr, events and the Operator cleanup investigation child with peer-runtime before loading their runtime bodies.
  - Run the plugin selection projection and runtime refresh inside one host transaction with configuration restores.
extensions:
  harnessTier: "composition"
source:
  include:
    - "src/cli/index.ts"
    - "src/cli/commands/mcp.ts"
    - "src/cli/commands/operator.ts"
    - "src/cli/commands/herdr.ts"
    - "src/cli/commands/events.ts"
    - "src/cli/commands/doc-sessions.ts"
    - "src/cli/commands/worktrees.ts"
    - "src/cli/commands/catch-up.ts"
  entrypoints:
    - id: entrypoint.global-runtime-reconciliation.cli-root
      path: "src/cli/index.ts"
      symbols:
        - name: "runCandidateRuntimeReconciliation"
          sinks:
            - id: sink.global-runtime-reconciliation.setup
              path: "src/cli/commands/global-runtime.ts"
              symbol: "runGlobalRuntimeSetup"
