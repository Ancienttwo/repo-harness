schemaVersion: archcontext.node/v2
id: component.global-runtime-reconciliation.cli-root
kind: component
name: CLI Composition Root
status: active
parent: capability.runtime-harness.global-runtime-reconciliation
layer: cli
summary: Builds the repo-harness command tree from the core and plugin command modules and runs the update transactions.
responsibilities:
  - Register every top-level command module in one commander program.
  - Run the profile projection and runtime refresh inside one host transaction with configuration restores.
extensions:
  harnessTier: "composition"
source:
  include:
    - "src/cli/index.ts"
  entrypoints:
    - id: entrypoint.global-runtime-reconciliation.cli-root
      path: "src/cli/index.ts"
      symbols:
        - name: "runCandidateRuntimeReconciliation"
          sinks:
            - id: sink.global-runtime-reconciliation.setup
              path: "src/cli/commands/global-runtime.ts"
              symbol: "runGlobalRuntimeSetup"
