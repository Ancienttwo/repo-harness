schemaVersion: archcontext.node/v2
id: component.publication.provider-feedback
kind: component
name: Provider Feedback
status: active
parent: capability.organization.publication
summary: Owns manual GitHub feedback observation, immutable feedback events, delivery receipts and historical repair-result projections.
responsibilities:
  - Persist provider facts as immutable events keyed by stable provider ids and keep mutable manual delivery state in separate files.
  - Project historical repair offers and no-progress outcomes without dispatching repairs or changing leases.
  - Read prior repair and completion records without creating new repair lifecycle records.
source:
  include:
    - "src/core/publication/feedback.ts"
    - "src/effects/publication/feedback.ts"
    - "src/effects/publication/feedback-store.ts"
