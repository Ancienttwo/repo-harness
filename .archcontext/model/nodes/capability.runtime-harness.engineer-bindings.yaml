schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.engineer-bindings"
kind: "capability"
name: "Engineer Bindings"
status: "active"
layer: "core"
summary: "Resolves tracked capability-backed Engineer Profile and SOP contracts and retains historical principal mapping and Claim Actor codecs."
responsibilities:
  - "Validate capability-backed Engineer Profile and SOP contracts without copying capability authority."
  - "Derive the exact engineer contract revision from the tracked profile, its SOP bytes and the capability revision."
  - "Retain historical principal mapping and Claim Actor codecs without a store reader; current session profile selection comes from explicit admitted metadata."
source:
  include:
    - agents/engineers/**
    - src/core/engineers/**
  exclude:
    - src/core/engineers/agent-runtime-effect.ts
    - src/core/engineers/engineering-overlay.ts
    - src/core/engineers/scheduling.ts
  entrypoints:
    - id: "entrypoint.engineer-bindings.profile"
      path: "src/effects/profiles/profile-store.ts"
      symbols:
        - name: "readProfileFile"
          sinks:
            - id: "sink.engineer-bindings.validate-profile"
              path: "src/core/engineers/profile-binding.ts"
              symbol: "validateModuleEngineerProfile"
            - id: "sink.engineer-bindings.contract-revision"
              path: "src/core/engineers/profile-binding.ts"
              symbol: "engineerContractRevision"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun run test:files tests/unit/engineer-profile-binding-v1.test.ts tests/unit/me0b-engineer-principal-claim-actor.test.ts --timeout 60000 --max-concurrency 1"
    - "bun run check:type"
