schemaVersion: "archcontext.node/v2"
id: "capability.runtime-harness.engineer-bindings"
kind: "capability"
name: "Engineer Bindings"
status: "active"
summary: "Resolves tracked capability-backed Engineer Profile and SOP contracts and retains historical engineer binding and claim actor codecs."
responsibilities:
  - "Validate capability-backed Engineer Profile and SOP contracts without copying capability authority."
  - "Read existing Engineer binding events and current records below the Git common directory without repair writes."
  - "Retain historical Claim Actor codecs without a live lease-owner reader; current session profile selection comes from explicit admitted metadata."
source:
  include:
    - "agents/engineers/**"
    - "src/core/engineers/**"
    - "src/effects/engineers/**"
    - "src/effects/profiles/profile-store.ts"
  exclude:
    - "src/core/engineers/agent-runtime-effect.ts"
    - "src/effects/engineers/agent-runtime-adapters/**"
    - "src/effects/engineers/agent-runtime-effect-store.ts"
    - "src/effects/engineers/agent-runtime-feature.ts"
    - "src/core/engineers/engineering-overlay.ts"
    - "src/core/engineers/scheduling.ts"
    - "src/effects/engineers/dependency-authority.ts"
    - "src/effects/engineers/engineering-overlay.ts"
    - "src/effects/engineers/scheduling.ts"
  entrypoints:
    - id: "entrypoint.engineer-bindings.read"
      path: "src/effects/engineers/binding-store.ts"
      symbols:
        - name: "readEngineerBindingStatus"
          sinks:
            - id: "sink.engineer-bindings.read"
              path: "src/effects/engineers/binding-store.ts"
              symbol: "readCurrent"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/unit/engineer-profile-binding-v1.test.ts tests/unit/engineer-binding-store.test.ts tests/unit/me0b-engineer-principal-claim-actor.test.ts --timeout 60000"
    - "bun run check:type"
