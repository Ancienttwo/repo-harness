schemaVersion: archcontext.node/v2
id: capability.runtime-harness.mcp-sidecar
kind: capability
name: MCP Sidecar
status: active
summary: Provides the local MCP sidecar and its repository access policy boundary.
responsibilities:
  - Own MCP lifecycle, workspace registration, access policy, and local browser integration.
  - Bind authorization-scoped MCP sessions to verified OAuth authorization IDs and expose the closed Engineer tool inventory without a coding runtime.
source:
  include:
    - "src/cli/mcp/**"
    - "src/cli/commands/mcp.ts"
    - "src/cli/chatgpt-browser/file-policy.ts"
    - "src/effects/repo-registry.ts"
    - "docs/repo-harness-chatgpt-mcp-setup.md"
    - "docs/reference-configs/chatgpt-coding-mcp.md"
    - "docs/researches/20260711-devspace-chatgpt-local-control.md"
  entrypoints:
    - id: entrypoint.mcp-sidecar.primary
      path: "src/cli/mcp/server.ts"
      symbols:
        - name: "createRepoHarnessMcpServer"
          sinks:
            - id: sink.mcp-sidecar.primary
              path: "src/cli/mcp/tools.ts"
              symbol: "callMcpTool"
    - id: entrypoint.mcp-sidecar.engineer-tools
      path: "src/cli/mcp/engineer-tools.ts"
      symbols:
        - name: "callEngineerTool"
          sinks:
            - id: sink.mcp-sidecar.engineer-principal
              path: "src/effects/engineers/principal.ts"
              symbol: "resolveEngineerPrincipal"
            - id: sink.mcp-sidecar.engineer-offers
              path: "src/effects/engineers/scheduling.ts"
              symbol: "collectEngineerOffers"
        - name: "messageSendAsEngineer"
          sinks:
            - id: sink.mcp-sidecar.engineer-messages
              path: "src/effects/engineers/module-inbox.ts"
              symbol: "sendModuleMessage"
        - name: "acquireAsEngineer"
          sinks:
            - id: sink.mcp-sidecar.engineer-acquire
              path: "src/effects/engineers/scheduling-acquire.ts"
              symbol: "acquireScheduledEngineerTask"
        - name: "callEngineerTool"
          sinks:
            - id: sink.mcp-sidecar.agent-runtime-effect-status
              path: "src/effects/engineers/agent-runtime-effect-store.ts"
              symbol: "observeAgentRuntimeEffectStatus"
            - id: sink.mcp-sidecar.interface-change
              path: "src/effects/engineers/interface-change-store.ts"
              symbol: "transitionInterfaceChangeRequest"
extensions:
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/cli/mcp*.test.ts tests/cli/engineer.test.ts"
    - "bun run check:type"
    - "repo-harness mcp doctor --repo . --live"
