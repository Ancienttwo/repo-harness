schemaVersion: "archcontext.flow/v1"
id: "flow.integration-acceptance.lifecycle"
capabilityId: "capability.runtime-harness.integration-acceptance"
name: "Freeze and revalidate one exact combined candidate"
applicability: "required"
participants:
  - id: "integration-plane"
    nodeId: "capability.runtime-harness.integration-acceptance"
  - id: "evidence-schema"
    nodeId: "component.integration-acceptance.primary"
  - id: "publication"
    nodeId: "capability.organization.publication"
steps:
  - id: "freeze-requirement"
    from: "integration-plane"
    to: "evidence-schema"
    label: "Digest one Approved PRD and source spec into an immutable IntegrationContract"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.contract-canonical"
      sourceSymbol: "buildIntegrationContract"
      sinkId: "sink.integration-acceptance.contract-canonical"
  - id: "observe-provider-integration"
    from: "integration-plane"
    to: "publication"
    label: "Collect and reobserve exact provider PR identity and actual merge commit/tree evidence"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.publication-observation"
      sourceSymbol: "observeSelectedPullRequest"
      sinkId: "sink.integration-acceptance.provider-integration"
  - id: "prove-local-tree"
    from: "integration-plane"
    to: "evidence-schema"
    label: "Compare the actual provider merge tree with its exact local commit"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.envelope"
      sourceSymbol: "observeSelectedPullRequest"
      sinkId: "sink.integration-acceptance.local-merge-tree"
  - id: "prove-local-ancestry"
    from: "integration-plane"
    to: "evidence-schema"
    label: "Prove selected base to actual merge commit and merge commit to exact final candidate ancestry"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.envelope"
      sourceSymbol: "observeSelectedPullRequest"
      sinkId: "sink.integration-acceptance.local-ancestry"
  - id: "freeze-candidate"
    from: "integration-plane"
    to: "evidence-schema"
    label: "Freeze exact reobserved PR integrations into one existing Git head and tree"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.envelope-canonical"
      sourceSymbol: "buildIntegrationEnvelope"
      sinkId: "sink.integration-acceptance.envelope-canonical"
  - id: "freeze-matrix"
    from: "integration-plane"
    to: "evidence-schema"
    label: "Require exactly one passing immutable evidence row for every contract constraint"
    evidence:
      entrypointId: "entrypoint.integration-acceptance.matrix-canonical"
      sourceSymbol: "buildAcceptanceMatrix"
      sinkId: "sink.integration-acceptance.matrix-canonical"
outcomes:
  - id: "success"
    kind: "success"
    label: "Current authority bytes and the existing passing AcceptanceReceipt project onto the exact candidate"
    steps:
      - id: "project-acceptance"
        from: "integration-plane"
        to: "evidence-schema"
        label: "Revalidate every fence and content-address the existing product verdict"
        evidence:
          entrypointId: "entrypoint.integration-acceptance.product-canonical"
          sourceSymbol: "buildProductAcceptanceProjection"
          sinkId: "sink.integration-acceptance.product-canonical"
    terminal:
      participant: "integration-plane"
      label: "Return immutable ProductAcceptanceProjectionV2 with every authority unchanged"
  - id: "stale"
    kind: "error"
    label: "Any stale requirement, provider integration, candidate, matrix, evidence or acceptance receipt fails closed"
    steps:
      - id: "reject-stale-authority"
        from: "integration-plane"
        to: "evidence-schema"
        label: "Reject the mismatched authority before persisting a product projection"
        evidence:
          entrypointId: "entrypoint.integration-acceptance.product-canonical"
          sourceSymbol: "buildProductAcceptanceProjection"
          sinkId: "sink.integration-acceptance.product-canonical"
    terminal:
      participant: "integration-plane"
      label: "Return a typed integration error without mutation or fallback"
