{
  "schemaVersion": "archcontext.flow/v1",
  "id": "flow.engineer-bindings.primary",
  "capabilityId": "capability.runtime-harness.engineer-bindings",
  "name": "Read the retained Engineer binding",
  "applicability": "required",
  "participants": [
    {
      "id": "engineer",
      "nodeId": "capability.runtime-harness.engineer-bindings"
    },
    {
      "id": "store",
      "nodeId": "component.engineer-bindings.primary"
    }
  ],
  "steps": [
    {
      "id": "read",
      "from": "engineer",
      "to": "store",
      "label": "Read the current binding for an operator observation",
      "evidence": {
        "entrypointId": "entrypoint.engineer-bindings.read",
        "sourceSymbol": "readEngineerBindingStatus",
        "sinkId": "sink.engineer-bindings.read"
      }
    }
  ],
  "outcomes": [
    {
      "id": "success",
      "kind": "success",
      "label": "Return the retained observation",
      "steps": [
        {
          "id": "success-read",
          "from": "engineer",
          "to": "store",
          "label": "Read the exact current record",
          "evidence": {
            "entrypointId": "entrypoint.engineer-bindings.read",
            "sourceSymbol": "readEngineerBindingStatus",
            "sinkId": "sink.engineer-bindings.read"
          }
        }
      ],
      "terminal": {
        "participant": "engineer",
        "label": "Return the read result"
      }
    },
    {
      "id": "error",
      "kind": "error",
      "label": "Refuse an unavailable or invalid observation",
      "steps": [
        {
          "id": "error-read",
          "from": "engineer",
          "to": "store",
          "label": "Keep a failed read unavailable",
          "evidence": {
            "entrypointId": "entrypoint.engineer-bindings.read",
            "sourceSymbol": "readEngineerBindingStatus",
            "sinkId": "sink.engineer-bindings.read"
          }
        }
      ],
      "terminal": {
        "participant": "engineer",
        "label": "Report the read failure without task mutation"
      }
    }
  ]
}
