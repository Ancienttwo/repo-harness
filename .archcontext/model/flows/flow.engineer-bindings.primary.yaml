{
  "schemaVersion": "archcontext.flow/v1",
  "id": "flow.engineer-bindings.primary",
  "capabilityId": "capability.runtime-harness.engineer-bindings",
  "name": "Resolve one tracked Engineer profile",
  "applicability": "required",
  "participants": [
    {
      "id": "engineer",
      "nodeId": "capability.runtime-harness.engineer-bindings"
    },
    {
      "id": "store",
      "nodeId": "component.engineer-bindings.primary"
    }
  ],
  "steps": [
    {
      "id": "validate",
      "from": "engineer",
      "to": "store",
      "label": "Validate the tracked profile JSON against the closed profile schema",
      "evidence": {
        "entrypointId": "entrypoint.engineer-bindings.profile",
        "sourceSymbol": "readProfileFile",
        "sinkId": "sink.engineer-bindings.validate-profile"
      }
    }
  ],
  "outcomes": [
    {
      "id": "success",
      "kind": "success",
      "label": "The profile, SOP and capability resolve",
      "steps": [
        {
          "id": "contract-revision",
          "from": "engineer",
          "to": "store",
          "label": "Derive the exact engineer contract revision from the profile, SOP bytes and capability revision",
          "evidence": {
            "entrypointId": "entrypoint.engineer-bindings.profile",
            "sourceSymbol": "readProfileFile",
            "sinkId": "sink.engineer-bindings.contract-revision"
          }
        }
      ],
      "terminal": {
        "participant": "engineer",
        "label": "Return the resolved profile with its contract revision"
      }
    },
    {
      "id": "error",
      "kind": "error",
      "label": "Refuse an invalid profile",
      "steps": [
        {
          "id": "reject-profile",
          "from": "engineer",
          "to": "store",
          "label": "Reject a profile that breaks the closed schema with a typed error",
          "evidence": {
            "entrypointId": "entrypoint.engineer-bindings.profile",
            "sourceSymbol": "readProfileFile",
            "sinkId": "sink.engineer-bindings.validate-profile"
          }
        }
      ],
      "terminal": {
        "participant": "engineer",
        "label": "Report the profile error without a write"
      }
    }
  ]
}
