schemaVersion: "archcontext.flow/v1"
id: "flow.operator.organization-validation"
capabilityId: "capability.runtime-harness.operator"
name: "Validate current organization observations at the repository response boundary"
applicability: "required"
participants:
  - id: "http"
    nodeId: "component.operator.primary"
  - id: "views"
    nodeId: "component.operator.view-projections"
steps:
  - id: "decode"
    from: "http"
    to: "views"
    label: "Decode observed organization V2 data using the requested registry repository identity before accepting the repository response"
    evidence:
      entrypointId: "entrypoint.operator.organization-validation"
      sourceSymbol: "assertOperatorRepositorySnapshotIdentity"
      sinkId: "sink.operator.organization-validation"
outcomes:
  - id: "valid"
    kind: "success"
    label: "The bounded closed payload and its linked observations agree"
    steps:
      - id: "accept"
        from: "http"
        to: "views"
        label: "Validate exact fields, admitted scheduling identities, component consistency, SHA syntax and overlay-to-attention digest linkage"
        evidence:
          entrypointId: "entrypoint.operator.organization-validation"
          sourceSymbol: "assertOperatorRepositorySnapshotIdentity"
          sinkId: "sink.operator.organization-validation"
    terminal:
      participant: "http"
      label: "Accept the scoped organization observation without changing provider or admission authority"
  - id: "invalid"
    kind: "error"
    label: "The response violates the closed organization contract"
    steps:
      - id: "reject"
        from: "http"
        to: "views"
        label: "Reject malformed, oversized, foreign-repository or internally inconsistent organization observations; map decoder rejection to the existing scoped-response error"
        evidence:
          entrypointId: "entrypoint.operator.organization-validation"
          sourceSymbol: "assertOperatorRepositorySnapshotIdentity"
          sinkId: "sink.operator.organization-validation"
    terminal:
      participant: "http"
      label: "Refuse the invalid scoped repository source; never relabel it or restore a legacy DTO"
