schemaVersion: archcontext.flow/v1
id: flow.provider-thread-effects.lifecycle
capabilityId: capability.runtime-harness.provider-thread-effects
name: Admit and reconcile one host-owned Codex Thread effect
applicability: required
participants:
  - id: effect-journal
    nodeId: capability.runtime-harness.provider-thread-effects
  - id: binding-authority
    nodeId: capability.runtime-harness.engineer-bindings
  - id: message-authority
    nodeId: capability.runtime-harness.engineer-messages
  - id: effect-schema
    nodeId: component.provider-thread-effects.primary
steps:
  - id: resolve-persisted-input
    from: effect-journal
    to: message-authority
    label: Read the exact persisted event and pending delivery receipt before any action admission
    evidence:
      entrypointId: entrypoint.provider-thread-effects.prepare
      sourceSymbol: assertPendingMessage
      sinkId: sink.provider-thread-effects.persisted-message
  - id: revalidate-binding
    from: effect-journal
    to: binding-authority
    label: Revalidate Binding generation, host, Thread and contract revision
    evidence:
      entrypointId: entrypoint.provider-thread-effects.prepare
      sourceSymbol: assertCurrentBinding
      sinkId: sink.provider-thread-effects.current-binding
outcomes:
  - id: success
    kind: success
    label: One immutable intent admits at most one host action and exact Provider evidence closes the observation chain
    steps:
      - id: project-positive-delivery
        from: effect-journal
        to: message-authority
        label: Idempotently publish one delivered observation only after exact Codex correlation
        evidence:
          entrypointId: entrypoint.provider-thread-effects.observe
          sourceSymbol: projectSuccessfulDelivery
          sinkId: sink.provider-thread-effects.delivery-observation
    terminal:
      participant: effect-journal
      label: Return terminal effect current and no further host action
  - id: reconcile
    kind: error
    label: Lost acknowledgement or ambiguous Provider facts remain reconciliation_required without retry
    steps:
      - id: preserve-message
        from: effect-journal
        to: effect-schema
        label: Persist reconciliation_required in the immutable effect chain while leaving the ME-1C receipt pending
        evidence:
          entrypointId: entrypoint.provider-thread-effects.observe
          sourceSymbol: observeProviderThreadEffect
          sinkId: sink.provider-thread-effects.reconciliation-observation
    terminal:
      participant: effect-journal
      label: Return reconcile-only state and no host action
