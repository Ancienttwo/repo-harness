schemaVersion: archcontext.flow/v1
id: flow.pm-dispatch.primary
capabilityId: capability.runtime-harness.pm-dispatch
name: Execute one bounded PM request
applicability: required
participants:
  - id: pm
    nodeId: capability.runtime-harness.pm-dispatch
  - id: operation
    nodeId: component.pm-dispatch.primary
steps:
  - id: validate-request
    from: pm
    to: operation
    label: Validate the closed request against current task authority
    evidence:
      entrypointId: entrypoint.pm-dispatch.request
      sourceSymbol: runPmJson
      sinkId: sink.pm-dispatch.operation
outcomes:
  - id: success
    kind: success
    label: Return task observations or a request-bound result
    steps:
      - id: return-result
        from: operation
        to: pm
        label: Return the operation response without a second task authority
        evidence:
          entrypointId: entrypoint.pm-dispatch.request
          sourceSymbol: runPmJson
          sinkId: sink.pm-dispatch.operation
    terminal:
      participant: pm
      label: Report the observed result and remaining verification
  - id: denied
    kind: error
    label: Reject an invalid or unapproved request
    steps:
      - id: return-denial
        from: operation
        to: pm
        label: Return a structured denial without broadening permissions
        evidence:
          entrypointId: entrypoint.pm-dispatch.request
          sourceSymbol: runPmJson
          sinkId: sink.pm-dispatch.operation
    terminal:
      participant: pm
      label: Keep the request blocked until its existing authority is valid
