schemaVersion: archcontext.flow/v1
id: flow.automation-budget.reserve-before-act
capabilityId: capability.runtime-harness.automation-budget
name: Refuse the next operation before any hard limit is exceeded
applicability: required
participants:
  - id: budget
    nodeId: capability.runtime-harness.automation-budget
  - id: ledger
    nodeId: component.automation-budget.ledger
steps:
  - id: decide-reservation
    from: budget
    to: ledger
    label: Re-read the budget revision and folded ledger, then decide the next operation under the run lock
    evidence:
      entrypointId: entrypoint.automation-budget.reserve
      sourceSymbol: reserveAutomationBudget
      sinkId: sink.automation-budget.reservation-decision
outcomes:
  - id: granted
    kind: success
    label: A reservation inside every hard limit is charged exactly once
    steps:
      - id: append-authoritative-usage
        from: budget
        to: ledger
        label: Append the authoritative usage event for the exact reservation
        evidence:
          entrypointId: entrypoint.automation-budget.append
          sourceSymbol: commitUsage
          sinkId: sink.automation-budget.usage-event
      - id: chain-ledger
        from: budget
        to: ledger
        label: Chain the append-only ledger digest so no earlier event can be edited out
        evidence:
          entrypointId: entrypoint.automation-budget.append
          sourceSymbol: commitUsage
          sinkId: sink.automation-budget.ledger-chain
    terminal:
      participant: budget
      label: Return the reservation and the updated projection without touching Task， Lease， Work Graph， or contract authority
  - id: exhausted
    kind: error
    label: A hard limit stops the run before the operation happens
    steps:
      - id: publish-stop-receipt
        from: budget
        to: ledger
        label: Publish the immutable stop receipt naming the triggering metric and the in-flight authority
        evidence:
          entrypointId: entrypoint.automation-budget.reserve
          sourceSymbol: persistStopReceipt
          sinkId: sink.automation-budget.stop-receipt
      - id: project-stopped-state
        from: budget
        to: ledger
        label: Project the stopped budget for the operator without provider-sensitive data
        evidence:
          entrypointId: entrypoint.automation-budget.project
          sourceSymbol: readAutomationBudgetBoardSlice
          sinkId: sink.automation-budget.operator-slice
    terminal:
      participant: budget
      label: Refuse with a typed refusal and leave every in-flight authority to its own owner's normal recovery
