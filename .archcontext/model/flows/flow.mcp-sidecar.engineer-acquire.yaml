schemaVersion: archcontext.flow/v1
id: flow.mcp-sidecar.engineer-acquire
capabilityId: capability.runtime-harness.mcp-sidecar
name: Acquire a Fleet task as an authenticated Module Engineer
applicability: required
participants:
  - id: engineer-mcp
    nodeId: capability.runtime-harness.mcp-sidecar
  - id: scheduling-authority
    nodeId: capability.runtime-harness.engineer-scheduling
steps:
  - id: acquire-and-publish
    from: engineer-mcp
    to: scheduling-authority
    label: Revalidate the exact Engineer offer before delegated Fleet acquisition
    evidence:
      entrypointId: entrypoint.mcp-sidecar.engineer-tools
      sourceSymbol: acquireAsEngineer
      sinkId: sink.mcp-sidecar.engineer-acquire
outcomes:
  - id: success
    kind: success
    label: Exact WorkEnvelope and ClaimActorReceipt are returned
    steps:
      - id: return-receipt
        from: engineer-mcp
        to: scheduling-authority
        label: Return the live-validated envelope and immutable receipt
        evidence:
          entrypointId: entrypoint.mcp-sidecar.engineer-tools
          sourceSymbol: acquireAsEngineer
          sinkId: sink.mcp-sidecar.engineer-acquire
    terminal:
      participant: engineer-mcp
      label: Return authenticated acquire result
  - id: error
    kind: error
    label: Authorization, graph, dependency, concurrency, Binding, offer, receipt, or compensation validation fails
    steps:
      - id: fail-closed
        from: engineer-mcp
        to: scheduling-authority
        label: Return typed refusal and never release a foreign Claim
        evidence:
          entrypointId: entrypoint.mcp-sidecar.engineer-tools
          sourceSymbol: acquireAsEngineer
          sinkId: sink.mcp-sidecar.engineer-acquire
    terminal:
      participant: engineer-mcp
      label: Return typed fail-closed error
