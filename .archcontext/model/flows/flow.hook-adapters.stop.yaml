schemaVersion: archcontext.flow/v1
id: flow.hook-adapters.stop
capabilityId: capability.runtime-harness.hook-adapters
name: "Render the Stop recovery views"
applicability: required
participants:
  - id: route-runtime
    nodeId: component.hook-adapters.primary
  - id: session-lifecycle
    nodeId: component.hook-adapters.session-lifecycle
  - id: evidence
    nodeId: capability.runtime-harness.evidence-ledger
steps:
  - id: bind-stop
    from: route-runtime
    to: session-lifecycle
    label: "Run the stop handler with the payload identity"
    evidence:
      entrypointId: entrypoint.hook-adapters.handler-bindings
      sourceSymbol: "handlers"
      sinkId: sink.hook-adapters.stop-handler
outcomes:
  - id: success
    kind: success
    label: "The checkpoint is published and the recovery views are rendered"
    steps:
      - id: publish-checkpoint
        from: session-lifecycle
        to: evidence
        label: "Publish the evidence checkpoint from the ledger"
        evidence:
          entrypointId: entrypoint.hook-adapters.stop
          sourceSymbol: "runStopHandler"
          sinkId: sink.hook-adapters.evidence-checkpoint
    terminal:
      participant: session-lifecycle
      label: "Render handoff and resume and exit 0"
  - id: error
    kind: error
    label: "A failed publish leaves the last published checkpoint in place"
    steps:
      - id: keep-last-checkpoint
        from: session-lifecycle
        to: evidence
        label: "Catch the publish error and keep the last published checkpoint"
        evidence:
          entrypointId: entrypoint.hook-adapters.stop
          sourceSymbol: "runStopHandler"
          sinkId: sink.hook-adapters.evidence-checkpoint
    terminal:
      participant: session-lifecycle
      label: "Render handoff and resume from the last published checkpoint and exit 0"
