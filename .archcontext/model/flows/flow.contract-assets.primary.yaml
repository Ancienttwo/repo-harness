schemaVersion: archcontext.flow/v1
id: flow.contract-assets.primary
capabilityId: capability.workflow-engine.contract-assets
name: "Project the standalone capability resolver"
applicability: required
participants:
  - id: capability
    nodeId: capability.workflow-engine.contract-assets
  - id: projection
    nodeId: component.contract-assets.template-projection
steps:
  - id: build-resolver
    from: capability
    to: projection
    label: "Build the standalone resolver from scripts/capability-resolver.ts and the registry core"
    evidence:
      entrypointId: entrypoint.contract-assets.primary
      sourceSymbol: "main"
      sinkId: sink.contract-assets.capability-projection
outcomes:
  - id: success
    kind: success
    label: "The resolver copy matches its source"
    steps:
      - id: write-copies
        from: capability
        to: projection
        label: "Write a byte and mode identical resolver copy atomically"
        evidence:
          entrypointId: entrypoint.contract-assets.primary
          sourceSymbol: "main"
          sinkId: sink.contract-assets.projection-write
    terminal:
      participant: projection
      label: "The resolver copy equals its source"
  - id: error
    kind: error
    label: "The resolver copy drifts or an unclassified helper file exists"
    steps:
      - id: report-drift
        from: capability
        to: projection
        label: "Compare projected bytes and report drift in check mode"
        evidence:
          entrypointId: entrypoint.contract-assets.primary
          sourceSymbol: "main"
          sinkId: sink.contract-assets.projection-compare
    terminal:
      participant: capability
      label: "Exit non-zero without a partial projection"
