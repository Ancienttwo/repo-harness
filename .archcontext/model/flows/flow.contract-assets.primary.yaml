schemaVersion: archcontext.flow/v1
id: flow.contract-assets.primary
capabilityId: capability.workflow-engine.contract-assets
name: "Project helper copies from the workflow contract"
applicability: required
participants:
  - id: capability
    nodeId: capability.workflow-engine.contract-assets
  - id: projection
    nodeId: component.contract-assets.template-projection
  - id: contract
    nodeId: component.contract-assets.primary
steps:
  - id: load-contract
    from: projection
    to: contract
    label: "Load the package workflow contract"
    evidence:
      entrypointId: entrypoint.contract-assets.primary
      sourceSymbol: "main"
      sinkId: sink.contract-assets.primary
  - id: list-helpers
    from: projection
    to: contract
    label: "Read helpers.scripts as the only helper id list"
    evidence:
      entrypointId: entrypoint.contract-assets.primary
      sourceSymbol: "main"
      sinkId: sink.contract-assets.helper-inventory
outcomes:
  - id: success
    kind: success
    label: "Every helper copy matches its source"
    steps:
      - id: write-copies
        from: capability
        to: projection
        label: "Write byte and mode identical helper copies atomically"
        evidence:
          entrypointId: entrypoint.contract-assets.primary
          sourceSymbol: "main"
          sinkId: sink.contract-assets.projection-write
    terminal:
      participant: projection
      label: "Helper copies equal the contract inventory"
  - id: error
    kind: error
    label: "A helper copy drifts or the inventory is unsafe"
    steps:
      - id: report-drift
        from: capability
        to: projection
        label: "Compare projected bytes and report drift in check mode"
        evidence:
          entrypointId: entrypoint.contract-assets.primary
          sourceSymbol: "main"
          sinkId: sink.contract-assets.projection-compare
    terminal:
      participant: capability
      label: "Exit non-zero without a partial projection"
