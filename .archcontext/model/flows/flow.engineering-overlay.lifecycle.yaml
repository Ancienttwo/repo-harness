schemaVersion: "archcontext.flow/v1"
id: "flow.engineering-overlay.lifecycle"
capabilityId: "capability.runtime-harness.engineering-overlay"
name: "Project a consistency-fenced Engineering Overlay"
applicability: "required"
participants:
  - id: "overlay"
    nodeId: "capability.runtime-harness.engineering-overlay"
  - id: "schema"
    nodeId: "component.engineering-overlay.primary"
steps:
  - id: "read-observations"
    from: "overlay"
    to: "overlay"
    label: "Read scheduling and runtime observations in each pass of the consistency fence"
    evidence:
      entrypointId: "entrypoint.engineering-overlay.collect"
      sourceSymbol: "collectEngineeringBoard"
      sinkId: "sink.engineering-overlay.read-pass"
  - id: "project-current-runtime"
    from: "overlay"
    to: "overlay"
    label: "Project runtime evidence filtered to the exact admitted session and selected engineer profile"
    evidence:
      entrypointId: "entrypoint.engineering-overlay.collect"
      sourceSymbol: "read"
      sinkId: "sink.engineering-overlay.runtime-projection"
  - id: "project-overlay"
    from: "overlay"
    to: "schema"
    label: "Content-address the double-read admitted scheduling and runtime projection with explicit component fences"
    evidence:
      entrypointId: "entrypoint.engineering-overlay.collect"
      sourceSymbol: "collectEngineeringBoard"
      sinkId: "sink.engineering-overlay.schema"
outcomes:
  - id: "read-model"
    kind: "success"
    label: "Return stable, changed_during_read or degraded without changing an observed authority"
    steps:
      - id: "derive-organization-attention"
        from: "overlay"
        to: "schema"
        label: "Derive profile assignment, profile drift and runtime reconciliation attention from the admitted overlay"
        evidence:
          entrypointId: "entrypoint.engineering-overlay.collect"
          sourceSymbol: "collectEngineeringBoard"
          sinkId: "sink.engineering-overlay.attention-schema"
    terminal:
      participant: "overlay"
      label: "Return read-only JSON/text projection with no authority mutation"
  - id: "invalid-projection"
    kind: "error"
    label: "The supplied scheduling observation belongs to a different repository"
    steps:
      - id: "validate-overlay-schema"
        from: "overlay"
        to: "schema"
        label: "Reject mismatched scheduling repository identity before returning a projection"
        evidence:
          entrypointId: "entrypoint.engineering-overlay.overlay-schema"
          sourceSymbol: "buildAdmittedEngineeringOverlay"
          sinkId: "sink.engineering-overlay.overlay-validation"
    terminal:
      participant: "overlay"
      label: "Return a typed projection error with every observed authority unchanged"
