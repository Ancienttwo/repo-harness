schemaVersion: "archcontext.flow/v1"
id: "flow.workflow-state.board"
capabilityId: "capability.workflow-engine.workflow-state"
name: "Observe the provider issue and admitted session board"
applicability: "required"
participants:
  - id: "capability"
    nodeId: "capability.workflow-engine.workflow-state"
  - id: "plane"
    nodeId: "component.workflow-state.coordination-plane"
steps:
  - id: "collect"
    from: "capability"
    to: "plane"
    label: "Collect exact provider issue observations and all current admitted session associations"
    evidence:
      entrypointId: "entrypoint.workflow-state.board"
      sourceSymbol: "resolveProviderBoard"
      sinkId: "sink.workflow-state.board-inputs"
outcomes:
  - id: "success"
    kind: "success"
    label: "Board revisions match before and after the projection"
    steps:
      - id: "project-stable"
        from: "capability"
        to: "plane"
        label: "Project the complete provider and session observation for bounded revision comparison"
        evidence:
          entrypointId: "entrypoint.workflow-state.board"
          sourceSymbol: "resolveProviderBoard"
          sinkId: "sink.workflow-state.board-projection"
    terminal:
      participant: "capability"
      label: "Return a stable provider board after equal complete revisions"
  - id: "error"
    kind: "error"
    label: "Complete observations keep changing through the bounded retry"
    steps:
      - id: "project-torn"
        from: "capability"
        to: "plane"
        label: "Project the complete provider and session observation for bounded revision comparison"
        evidence:
          entrypointId: "entrypoint.workflow-state.board"
          sourceSymbol: "resolveProviderBoard"
          sinkId: "sink.workflow-state.board-projection"
    terminal:
      participant: "capability"
      label: "Return the final observation marked changed_during_read without mutation"
