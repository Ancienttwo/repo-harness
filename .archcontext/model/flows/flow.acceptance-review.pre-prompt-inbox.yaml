schemaVersion: "archcontext.flow/v1"
id: "flow.acceptance-review.pre-prompt-inbox"
capabilityId: "capability.verification.acceptance-review"
name: "Commit automatic inbox delivery only after accepted prompt proof"
applicability: "required"
participants:
  - id: "round"
    nodeId: "component.acceptance-review.primary"
  - id: "host"
    nodeId: "capability.runtime-harness.task-agent-host"
  - id: "runner"
    nodeId: "component.task-agent-host.review-runner"
  - id: "session"
    nodeId: "component.task-agent-host.primary"
  - id: "artifacts"
    nodeId: "capability.workflow-engine.execution-primitives"
  - id: "inbox"
    nodeId: "capability.organization.task-fleet"
steps:
  - id: "reserve"
    from: "host"
    to: "runner"
    label: "When review sends a request through the runner port, reserve exact bounded request and native-session context without writing a delivery receipt"
    evidence:
      entrypointId: "entrypoint.task-agent-host.review-runner"
      sourceSymbol: "send"
      sinkId: "sink.task-agent-host.reserve-inbox"
  - id: "consume"
    from: "host"
    to: "runner"
    label: "Read and validate the reserved companion before prompting; consumption does not deliver messages"
    evidence:
      entrypointId: "entrypoint.task-agent-host.inbox-host"
      sourceSymbol: "runHostFileRequest"
      sinkId: "sink.task-agent-host.consume-inbox"
  - id: "observe-accepted-input"
    from: "host"
    to: "runner"
    label: "Pass input-scoped OAR snapshots to the accepted-proof recorder; ACK alone is not proof"
    evidence:
      entrypointId: "entrypoint.task-agent-host.inbox-host"
      sourceSymbol: "runHostFileRequest"
      sinkId: "sink.task-agent-host.accepted-inbox"
outcomes:
  - id: "accepted"
    kind: "success"
    label: "The exact native host accepted this request and companion under current admission"
    steps:
      - id: "persist-proof"
        from: "runner"
        to: "artifacts"
        label: "Persist the immutable accepted-input proof only after exact request, native identity and OAR control checks"
        evidence:
          entrypointId: "entrypoint.task-agent-host.inbox-proof"
          sourceSymbol: "recordPrePromptInboxAccepted"
          sinkId: "sink.task-agent-host.persist-inbox-proof"
      - id: "owner-settle"
        from: "round"
        to: "host"
        label: "The owner asks the runner to settle the request's companion during and after the round"
        evidence:
          entrypointId: "entrypoint.acceptance-review.round"
          sourceSymbol: "commitInbox"
          sinkId: "sink.acceptance-review.settle-companion"
      - id: "owner-recover"
        from: "round"
        to: "host"
        label: "A later round recovers accepted companions of earlier rounds without resending the prompt"
        evidence:
          entrypointId: "entrypoint.acceptance-review.round"
          sourceSymbol: "runReviewRound"
          sinkId: "sink.acceptance-review.recover-companions"
      - id: "owner-commit"
        from: "host"
        to: "runner"
        label: "The runner resumes the bounded commit for the settled request"
        evidence:
          entrypointId: "entrypoint.task-agent-host.review-runner"
          sourceSymbol: "settleCompanion"
          sinkId: "sink.task-agent-host.commit-inbox"
      - id: "revalidate-oar"
        from: "runner"
        to: "session"
        label: "Read the exact OAR observation and compare accepted input, native provider, request and proof sequence before delivery"
        evidence:
          entrypointId: "entrypoint.task-agent-host.inbox-commit"
          sourceSymbol: "commitPrePromptInbox"
          sinkId: "sink.task-agent-host.inbox-oar-proof"
      - id: "deliver"
        from: "runner"
        to: "inbox"
        label: "Commit the existing inbox delivery receipt with the exact controlled-request reference and reobserve its result"
        evidence:
          entrypointId: "entrypoint.task-agent-host.inbox-commit"
          sourceSymbol: "commitPrePromptInbox"
          sinkId: "sink.task-agent-host.deliver-inbox"
    terminal:
      participant: "inbox"
      label: "Return committed delivery receipts; provider claim and issue authority remain unchanged"
  - id: "pending"
    kind: "error"
    label: "Positive acceptance proof is absent or the send outcome remains unknown"
    steps:
      - id: "retain-pending"
        from: "runner"
        to: "session"
        label: "Resolve the exact bound session; without an accepted proof return pending before any delivery write"
        evidence:
          entrypointId: "entrypoint.task-agent-host.inbox-commit"
          sourceSymbol: "commitPrePromptInbox"
          sinkId: "sink.task-agent-host.inbox-session"
    terminal:
      participant: "round"
      label: "Leave messages pending; do not replay the prompt or infer delivery from ACK, timeout or a missing result"
