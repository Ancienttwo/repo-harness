schemaVersion: archcontext.flow/v1
id: flow.mcp-sidecar.primary
capabilityId: capability.runtime-harness.mcp-sidecar
name: "Dispatch an MCP tool call"
applicability: required
participants:
  - id: capability
    nodeId: capability.runtime-harness.mcp-sidecar
  - id: component
    nodeId: component.mcp-sidecar.primary
steps:
  - id: dispatch
    from: capability
    to: component
    label: "Dispatch MCP Tool Dispatcher"
    evidence:
      entrypointId: entrypoint.mcp-sidecar.primary
      sourceSymbol: "createRepoHarnessMcpServer"
      sinkId: sink.mcp-sidecar.primary
outcomes:
  - id: success
    kind: success
    label: "Dispatch an MCP tool call completes"
    steps:
      - id: invoke-success
        from: capability
        to: component
        label: "Invoke MCP Tool Dispatcher"
        evidence:
          entrypointId: entrypoint.mcp-sidecar.primary
          sourceSymbol: "createRepoHarnessMcpServer"
          sinkId: sink.mcp-sidecar.primary
    terminal:
      participant: capability
      label: Return success receipt
  - id: error
    kind: error
    label: "Dispatch an MCP tool call is rejected or fails"
    steps:
      - id: invoke-error
        from: capability
        to: component
        label: "Propagate MCP Tool Dispatcher failure"
        evidence:
          entrypointId: entrypoint.mcp-sidecar.primary
          sourceSymbol: "createRepoHarnessMcpServer"
          sinkId: sink.mcp-sidecar.primary
    terminal:
      participant: capability
      label: Return typed failure
