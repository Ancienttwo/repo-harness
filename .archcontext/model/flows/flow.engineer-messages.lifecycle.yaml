schemaVersion: archcontext.flow/v1
id: flow.engineer-messages.lifecycle
capabilityId: capability.runtime-harness.engineer-messages
name: Persist and consume one binding-fenced Module Engineer message
applicability: required
participants:
  - id: message-authority
    nodeId: capability.runtime-harness.engineer-messages
  - id: binding-authority
    nodeId: capability.runtime-harness.engineer-bindings
  - id: inbox
    nodeId: component.engineer-messages.primary
steps:
  - id: revalidate-binding
    from: message-authority
    to: binding-authority
    label: Resolve the exact current Engineer and assignment Binding fences
    evidence:
      entrypointId: entrypoint.engineer-messages.binding-fence
      sourceSymbol: validateTarget
      sinkId: sink.engineer-messages.binding-fence
  - id: persist-event-and-receipt
    from: message-authority
    to: inbox
    label: Write the immutable event and its pending receipt before any transport attempt
    evidence:
      entrypointId: entrypoint.engineer-messages.send
      sourceSymbol: persistEventAndReceipt
      sinkId: sink.engineer-messages.pending-receipt
outcomes:
  - id: success
    kind: success
    label: The recipient acknowledges after every referenced resource matches its digest
    steps:
      - id: acknowledge-after-resource-check
        from: message-authority
        to: inbox
        label: Re-read referenced resource bytes and refuse acknowledgement on any digest mismatch
        evidence:
          entrypointId: entrypoint.engineer-messages.acknowledge
          sourceSymbol: acknowledgeModuleMessage
          sinkId: sink.engineer-messages.resource-bytes
    terminal:
      participant: message-authority
      label: Return the acknowledged receipt
  - id: error
    kind: error
    label: A transport or external observation does not continue the exact receipt chain
    steps:
      - id: refuse-broken-chain
        from: message-authority
        to: inbox
        label: Accept an observation only for a pending receipt with the next attempt and the previous observation digest
        evidence:
          entrypointId: entrypoint.engineer-messages.external-delivery-observation
          sourceSymbol: appendObservation
          sinkId: sink.engineer-messages.observation-chain
    terminal:
      participant: message-authority
      label: Keep the last durable receipt and return a typed refusal
