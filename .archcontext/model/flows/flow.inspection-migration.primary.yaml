schemaVersion: archcontext.flow/v1
id: flow.inspection-migration.primary
capabilityId: capability.workflow-engine.inspection-migration
name: "Inspect before migration"
applicability: required
participants:
  - id: capability
    nodeId: capability.workflow-engine.inspection-migration
  - id: component
    nodeId: component.inspection-migration.primary
steps:
  - id: dispatch
    from: capability
    to: component
    label: "Dispatch Repository Inspector Process"
    evidence:
      entrypointId: entrypoint.inspection-migration.primary
      sourceSymbol: "runProcess"
      sinkId: sink.inspection-migration.primary
outcomes:
  - id: success
    kind: success
    label: "Inspect before migration completes"
    steps:
      - id: invoke-success
        from: capability
        to: component
        label: "Invoke Repository Inspector Process"
        evidence:
          entrypointId: entrypoint.inspection-migration.primary
          sourceSymbol: "runProcess"
          sinkId: sink.inspection-migration.primary
    terminal:
      participant: capability
      label: Return success receipt
  - id: error
    kind: error
    label: "Inspect before migration is rejected or fails"
    steps:
      - id: invoke-error
        from: capability
        to: component
        label: "Propagate Repository Inspector Process failure"
        evidence:
          entrypointId: entrypoint.inspection-migration.primary
          sourceSymbol: "runProcess"
          sinkId: sink.inspection-migration.primary
    terminal:
      participant: capability
      label: Return typed failure
