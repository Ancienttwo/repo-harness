schemaVersion: "archcontext.state-machine/v1"
id: "state-machine.operator.office-room"
capabilityId: "capability.runtime-harness.operator"
name: "Watch one room of the Office"
regions:
  - id: "parents"
    label: "The parents view"
    initial: "loading"
    states:
      - { id: "loading", label: "Loading" }
      - { id: "ready", label: "The parents list" }
      - { id: "failed", label: "Failed" }
  - id: "parents-read"
    label: "The parents read"
    initial: "reading"
    states:
      - { id: "reading", label: "In flight" }
      - { id: "waiting", label: "Waits for the next read" }
  - id: "seats"
    label: "The seats view"
    initial: "loading"
    states:
      - { id: "loading", label: "Loading or pending" }
      - { id: "ready", label: "The seats" }
      - { id: "failed", label: "Failed" }
  - id: "seats-read"
    label: "The seats read"
    initial: "reading"
    states:
      - { id: "reading", label: "In flight" }
      - { id: "waiting", label: "Waits for the next read" }
  - id: "stored"
    label: "The board view of the active parent"
    initial: "none"
    states:
      - { id: "none", label: "No board read settled" }
      - { id: "ready", label: "Board facts" }
      - { id: "stale", label: "Board facts marked stale" }
      - { id: "failed", label: "Failed" }
  - id: "b-read"
    label: "The board read"
    initial: "paused"
    states:
      - { id: "paused", label: "Paused with no active parent" }
      - { id: "reading", label: "In flight" }
      - { id: "waiting", label: "Waits for the next read" }
  - id: "screen"
    label: "The screen of the room"
    initial: "loading"
    source: { kind: "code", path: "src/operator-web/BoardPage.tsx", symbol: "OfficeRepository", confirmedDigest: "sha256:dd400f522c7e5918b89d30de102e279ffdafbc63b5db39479a16a11f9775a39c" }
    states:
      - { id: "loading", label: "Loading" }
      - { id: "checklist", label: "Setup checklist" }
      - { id: "room", label: "Room with the seats" }
events:
  - id: "parents-read-ends"
    label: "the parents read ends"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardParents", confirmedDigest: "sha256:fb64b57b491e2756c604e846b127b0a77ed0648f192131bb5c39524667a6f13c" }
    steps:
      - when: { parents: ["loading", "failed"], parents-read: ["reading"], seats: ["loading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", screen: "loading" }
      - when: { parents: ["loading", "failed"], parents-read: ["reading"], seats: ["ready"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["loading", "failed"], parents-read: ["reading"], seats: ["failed"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", screen: "checklist" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["loading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "loading" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["ready"], stored: ["none", "ready", "stale"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["ready"], stored: ["ready", "stale"], b-read: ["waiting"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["ready"], stored: ["failed"], b-read: ["reading", "waiting"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "checklist" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["ready"], stored: ["ready", "stale"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["ready"], stored: ["failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["failed"], stored: ["ready", "stale", "failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "ready", parents-read: "waiting", screen: "checklist" }
  - id: "parents-read-fails"
    label: "the parents read fails"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardParents", confirmedDigest: "sha256:fb64b57b491e2756c604e846b127b0a77ed0648f192131bb5c39524667a6f13c" }
    steps:
      - when: { parents: ["loading", "ready"], parents-read: ["reading"], seats: ["loading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", screen: "loading" }
      - when: { parents: ["loading"], parents-read: ["reading"], seats: ["ready"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", screen: "room" }
      - when: { parents: ["loading", "ready"], parents-read: ["reading"], seats: ["failed"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", screen: "checklist" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["ready"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", b-read: "paused", screen: "room" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["ready"], stored: ["ready", "stale", "failed"], b-read: ["waiting"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", b-read: "paused", screen: "room" }
      - when: { parents: ["ready"], parents-read: ["reading"], seats: ["failed"], stored: ["ready", "stale", "failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents: "failed", parents-read: "waiting", screen: "checklist" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["loading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "loading" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["ready"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "room" }
      - when: { parents: ["failed"], parents-read: ["reading"], seats: ["failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { parents-read: "waiting", screen: "checklist" }
  - id: "parents-timer"
    label: "the next parents read starts"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardParents", confirmedDigest: "sha256:fb64b57b491e2756c604e846b127b0a77ed0648f192131bb5c39524667a6f13c" }
    steps:
      - when: { parents-read: ["waiting"] }
        then: { parents-read: "reading" }
  - id: "seats-read-ends"
    label: "the seats read ends"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardSeats", confirmedDigest: "sha256:39bfc284acac54d0357b0985590d3d5b97968e633fb80abc782b20692862db25" }
    steps:
      - when: { parents: ["loading", "failed"], seats: ["loading", "failed"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "ready", seats-read: "waiting", screen: "room" }
      - when: { parents: ["loading", "failed"], seats: ["ready"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["loading", "failed"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "ready", seats-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], seats-read: ["reading"], stored: ["none", "ready", "stale"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], seats-read: ["reading"], stored: ["ready", "stale"], b-read: ["waiting"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], seats-read: ["reading"], stored: ["failed"], b-read: ["reading", "waiting"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["failed"], seats-read: ["reading"], stored: ["ready", "stale"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "ready", seats-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["ready"], seats: ["failed"], seats-read: ["reading"], stored: ["failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "ready", seats-read: "waiting", b-read: "reading", screen: "room" }
      - when: { parents: ["failed"], seats: ["ready"], seats-read: ["reading"], stored: ["ready", "stale", "failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "room" }
      - when: { parents: ["failed"], seats: ["failed"], seats-read: ["reading"], stored: ["ready", "stale", "failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "ready", seats-read: "waiting", screen: "room" }
  - id: "seats-read-pending"
    label: "the seats read gets pending before the first observation"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardSeats", confirmedDigest: "sha256:39bfc284acac54d0357b0985590d3d5b97968e633fb80abc782b20692862db25" }
    steps:
      - when: { seats: ["loading"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "loading" }
  - id: "seats-read-fails"
    label: "the seats read fails"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardSeats", confirmedDigest: "sha256:39bfc284acac54d0357b0985590d3d5b97968e633fb80abc782b20692862db25" }
    steps:
      - when: { parents: ["loading"], seats: ["loading", "ready"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "failed", seats-read: "waiting", screen: "checklist" }
      - when: { seats: ["failed"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "checklist" }
      - when: { parents: ["ready", "failed"], seats: ["loading"], seats-read: ["reading"], stored: ["none"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "failed", seats-read: "waiting", screen: "checklist" }
      - when: { parents: ["ready"], seats: ["ready"], seats-read: ["reading"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { seats: "failed", seats-read: "waiting", b-read: "paused", screen: "checklist" }
      - when: { parents: ["ready"], seats: ["ready"], seats-read: ["reading"], stored: ["ready", "stale", "failed"], b-read: ["waiting"], screen: ["loading", "checklist", "room"] }
        then: { seats: "failed", seats-read: "waiting", b-read: "paused", screen: "checklist" }
      - when: { parents: ["ready", "failed"], seats: ["failed"], seats-read: ["reading"], stored: ["ready", "stale", "failed"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats-read: "waiting", screen: "checklist" }
      - when: { parents: ["failed"], seats: ["ready"], seats-read: ["reading"], b-read: ["paused"], screen: ["loading", "checklist", "room"] }
        then: { seats: "failed", seats-read: "waiting", screen: "checklist" }
  - id: "seats-timer"
    label: "the next seats read starts"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoardSeats", confirmedDigest: "sha256:39bfc284acac54d0357b0985590d3d5b97968e633fb80abc782b20692862db25" }
    steps:
      - when: { seats-read: ["waiting"] }
        then: { seats-read: "reading" }
  - id: "board-read-ends"
    label: "the board read ends"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoard", confirmedDigest: "sha256:d2b254cef6478c5707f3afc0d4d37a36e91aeb9729d49d78dfa786776d64fa23" }
    steps:
      - when: { parents: ["ready"], seats: ["ready"], stored: ["none", "stale", "failed"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { stored: "ready", b-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], stored: ["ready"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { b-read: "waiting", screen: "room" }
  - id: "board-read-fails-kept"
    label: "the board read fails [busy, timeout or no answer]"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoard", confirmedDigest: "sha256:d2b254cef6478c5707f3afc0d4d37a36e91aeb9729d49d78dfa786776d64fa23" }
    steps:
      - when: { parents: ["ready"], seats: ["ready"], stored: ["none"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { stored: "failed", b-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], stored: ["ready"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { stored: "stale", b-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], stored: ["stale"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { b-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], stored: ["failed"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { b-read: "waiting", screen: "room" }
  - id: "board-read-fails-dropped"
    label: "the board read fails [invalid answer]"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoard", confirmedDigest: "sha256:d2b254cef6478c5707f3afc0d4d37a36e91aeb9729d49d78dfa786776d64fa23" }
    steps:
      - when: { parents: ["ready"], seats: ["ready"], stored: ["none", "ready", "stale"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { stored: "failed", b-read: "waiting", screen: "room" }
      - when: { parents: ["ready"], seats: ["ready"], stored: ["failed"], b-read: ["reading"], screen: ["loading", "checklist", "room"] }
        then: { b-read: "waiting", screen: "room" }
  - id: "board-timer"
    label: "the next board read starts"
    source: { kind: "code", path: "src/operator-web/board-view.ts", symbol: "useBoard", confirmedDigest: "sha256:d2b254cef6478c5707f3afc0d4d37a36e91aeb9729d49d78dfa786776d64fa23" }
    steps:
      - when: { b-read: ["waiting"] }
        then: { b-read: "reading" }
rules:
  - id: "seats-show-with-parents-list"
    label: "SeatsShowWithParentsList. When the page has the seats, they are on screen"
    never: { seats: ["ready"], screen: ["loading", "checklist"] }
