name: Install pinned Herdr
description: Install the checksum-verified CI runtime from the repository policy.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        pin='.ai/harness/policy.json'
        version="$(jq -er '.external_tooling.herdr.min_version' "$pin")"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) asset='linux-x86_64' ;;
          Darwin-arm64) asset='macos-aarch64' ;;
          Darwin-x86_64) asset='macos-x86_64' ;;
          *) echo 'Unsupported Herdr CI platform' >&2; exit 1 ;;
        esac
        url="$(jq -er --arg asset "$asset" '.external_tooling.herdr.release_assets[$asset].url' "$pin")"
        sha256="$(jq -er --arg asset "$asset" '.external_tooling.herdr.release_assets[$asset].sha256' "$pin")"
        download="$RUNNER_TEMP/herdr-download"
        curl --fail --location --retry 3 "$url" --output "$download"
        if [[ "$asset" == linux-* ]]; then
          echo "$sha256  $download" | sha256sum --check
        else
          echo "$sha256  $download" | shasum -a 256 --check
        fi
        bin="$RUNNER_TEMP/herdr-bin"
        mkdir -p "$bin"
        install -m 755 "$download" "$bin/herdr"
        test "$("$bin/herdr" --version)" = "herdr $version"
        echo "$bin" >> "$GITHUB_PATH"
