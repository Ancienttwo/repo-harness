name: Probe

# A manual run of named test files on one runner, for the head of the ref that it is dispatched on.
# It is never a required check and writes no record: the seat puts the run URL in the PR or issue.
# Each lane calls the entry point of the CI job whose result it predicts, so the result holds for that job.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner system
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: ubuntu-latest
      lane:
        description: home-isolation runs each file as Test HOME isolation does; affected-shard runs one shard as Affected tests does (ubuntu-latest only); release-rehearsal upgrades the published parent to this head (ubuntu-latest and macos-latest, ignores files, shard and repeat)
        type: choice
        options: [home-isolation, affected-shard, release-rehearsal]
        default: home-isolation
      files:
        description: Test paths, separated by spaces (release-rehearsal ignores it)
        type: string
        default: ''
      shard:
        description: affected-shard only, <index>/<total> of the plan made from the files
        type: string
        default: ''
      repeat:
        description: Rounds, 1 to 5
        type: number
        default: 1

run-name: Probe ${{ inputs.runner }} ${{ inputs.lane }} ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ inputs.runner }}, ${{ inputs.lane }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # Inputs reach the scripts only through these variables.
    env:
      PROBE_RUNNER: ${{ inputs.runner }}
      PROBE_LANE: ${{ inputs.lane }}
      PROBE_FILES: ${{ inputs.files }}
      PROBE_SHARD: ${{ inputs.shard }}
      PROBE_REPEAT: ${{ inputs.repeat }}
    steps:
      - name: Check the lane, shard and repeat inputs
        run: |
          # release-rehearsal ignores files, shard and repeat.
          if [[ "$PROBE_LANE" == release-rehearsal ]]; then
            if [[ "$PROBE_RUNNER" == windows-latest ]]; then echo "::error::release-rehearsal runs only on ubuntu-latest and macos-latest"; exit 1; fi
            exit 0
          fi
          # The file steps read one line; a second line would drop files without an error.
          if [[ "$PROBE_FILES" == *$'\n'* ]]; then echo "::error::files must be one line"; exit 1; fi
          case "$PROBE_REPEAT" in
            [1-5]) ;;
            *) echo "::error::repeat must be 1 to 5 (got '$PROBE_REPEAT')"; exit 1 ;;
          esac
          if [[ "$PROBE_LANE" == affected-shard ]]; then
            if [[ "$PROBE_RUNNER" != ubuntu-latest ]]; then echo "::error::affected-shard runs only on ubuntu-latest, as Affected tests does"; exit 1; fi
            if ! [[ "$PROBE_SHARD" =~ ^(0|[1-9][0-9]*)/([1-9][0-9]*)$ ]] || (( BASH_REMATCH[1] >= BASH_REMATCH[2] )); then
              echo "::error::affected-shard needs shard <index>/<total> with index < total (got '$PROBE_SHARD')"; exit 1
            fi
          elif [[ -n "$PROBE_SHARD" ]]; then
            echo "::error::shard applies only to affected-shard"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Affected tests checks out the full history; the HOME isolation job does not.
          fetch-depth: ${{ inputs.lane == 'affected-shard' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The runner is the isolation: the script installs into its HOME, which GitHub discards.
      - name: Rehearse the upgrade of the published parent to this head
        if: inputs.lane == 'release-rehearsal'
        run: |
          echo "[probe] head $(git rev-parse HEAD)"
          bash scripts/check-release-upgrade-rehearsal.sh
      - name: Check the test files
        if: inputs.lane != 'release-rehearsal'
        run: |
          echo "[probe] head $(git rev-parse HEAD)"
          read -ra files <<< "$PROBE_FILES"
          # With no file the suite selector discovers the whole suite, so an empty list stops here.
          if [[ "${#files[@]}" -eq 0 ]]; then echo "::error::files names no test path"; exit 1; fi
          # The suite selector refuses a duplicate and a path that is not tests/**/*.test.ts(x).
          bun scripts/select-test-suite.ts full "${files[@]}" > /dev/null
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then echo "::error::no such test file at this head: $file"; exit 1; fi
          done
      - name: Run the files as Test HOME isolation does
        if: inputs.lane == 'home-isolation'
        run: |
          bun install --frozen-lockfile
          source scripts/lib/ci-run-tests.sh
          read -ra files <<< "$PROBE_FILES"
          for ((round = 1; round <= PROBE_REPEAT; round++)); do
            echo "[probe] round $round/$PROBE_REPEAT"
            export BUN_TEST_JUNIT_DIR=".ai/harness/runs/junit/probe-round-$round"
            mkdir -p "$BUN_TEST_JUNIT_DIR"
            status=0
            for file in "${files[@]}"; do run_bun_test_file "$file" || status=1; done
            bun scripts/select-test-suite.ts reports "$BUN_TEST_JUNIT_DIR" "${files[@]}"
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          done
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
        if: inputs.lane == 'affected-shard'
      - if: inputs.lane == 'affected-shard'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install pinned herdr-core runtime
        if: inputs.lane == 'affected-shard'
        uses: ./.github/actions/install-pinned-herdr-core
      # The daily run on main saves the newest test durations; with them the plan matches the selection job's split.
      - uses: actions/cache/restore@v4
        if: inputs.lane == 'affected-shard'
        with:
          path: ${{ runner.temp }}/test-durations.json
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
      - name: Run one shard as Affected tests does
        if: inputs.lane == 'affected-shard'
        env:
          TEST_DURATIONS_FILE: ${{ runner.temp }}/test-durations.json
          CI_SHARD: ${{ inputs.shard }}
        run: |
          read -ra files <<< "$PROBE_FILES"
          bun scripts/select-test-suite.ts plan "$CI_SHARD" "${files[@]}"
          for ((round = 1; round <= PROBE_REPEAT; round++)); do
            echo "[probe] round $round/$PROBE_REPEAT"
            bash scripts/check-ci.sh affected
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.lane != 'release-rehearsal' }}
        with:
          name: probe-junit-${{ inputs.runner }}-${{ github.run_attempt }}
          path: .ai/harness/runs/junit
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
