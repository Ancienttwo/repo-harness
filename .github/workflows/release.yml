name: Release
run-name: Release ${{ inputs.sha }}

# One run publishes both packages, tags the release commit and creates its GitHub Release (#2194).
# The `release` environment requires the owner's approval; that approval authorizes this deployment.
# npm Trusted Publishing (OIDC) authenticates the publishes; each trusted publisher names this workflow and the
# `release` environment, so no other job can publish. No npm token exists.
# `validate` reads the input commit as data with inline git. `lane` installs, checks, guards and packs the input
# commit without id-token. `publish` holds id-token and runs no code from the input commit: it has no checkout,
# reads the packed tarballs as data and publishes them with --ignore-scripts. `release` reads back, tags and
# creates the GitHub Release without id-token.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the merged release commit on main
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    env:
      SHA: ${{ inputs.sha }}
    steps:
      # Only git and jq run here; the input commit is read as data, never checked out or run.
      # grep reads all input without -q: an early exit would end git with SIGPIPE, which pipefail reports.
      - id: validate
        name: Refuse a commit that is not a release commit on main
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "$SHA is not a full commit SHA."
          git init -q release-check
          cd release-check
          git fetch -q --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" +refs/heads/main:refs/remotes/origin/main
          git rev-list --first-parent refs/remotes/origin/main | grep -x "$SHA" >/dev/null || fail "$SHA is not a first-parent commit of main."
          parent="$(git rev-parse "$SHA^1")"
          version="$(git show "$SHA:package.json" | jq -r .version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "package.json at $SHA has version $version."
          for file in package.json packages/operator-web/package.json; do
            now="$(git show "$SHA:$file" | jq -r .version)"
            before="$(git show "$parent:$file" | jq -r .version)"
            [[ "$now" == "$version" ]] || fail "$file at $SHA has version $now, not $version."
            [[ "$before" != "$version" ]] || fail "$file already has version $version at the parent $parent; $SHA is not the release commit."
          done
          git show "$SHA:docs/CHANGELOG.md" | grep -F "## [$version]" >/dev/null || fail "docs/CHANGELOG.md at $SHA has no [$version] section."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$SHA is the release commit of $version."

  lane:
    name: Check, guard and pack
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SHA: ${{ inputs.sha }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUN_TEST_MAX_CONCURRENCY: '1'
      BUN_TEST_TIMEOUT_MS: '60000'
      BUN_TEST_ISOLATE_FILES: '1'
      BUN_TEST_JOBS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install pinned herdr-core runtime
        uses: ./.github/actions/install-pinned-herdr-core
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      # The script compares origin/main with the live main, so each script step fetches main first.
      - name: Guard the release commit and its unpublished version
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(bash scripts/release-owner-steps.sh workflow-guard "$SHA")" == "$VERSION" ]]
      # npm pack runs the prepack builds; publish later runs no package script.
      - name: Pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/release-tarballs"
          (cd packages/operator-web && npm pack --pack-destination "$RUNNER_TEMP/release-tarballs")
          npm pack --pack-destination "$RUNNER_TEMP/release-tarballs"
          ls "$RUNNER_TEMP/release-tarballs/repo-harness-operator-web-$VERSION.tgz" "$RUNNER_TEMP/release-tarballs/repo-harness-$VERSION.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [validate, lane]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARBALLS: ${{ github.workspace }}/release-tarballs
    # Only this workflow's inline steps and SHA-pinned actions run here; the tarballs are data.
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # npm Trusted Publishing needs npm 11.5.1 or later.
      - name: Require OIDC-capable npm
        run: node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} cannot publish with OIDC; 11.5.1 or later is required.`); process.exit(1); }' "$(npm --version)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: ${{ env.TARBALLS }}
      - name: Check the tarballs and that both versions are unpublished
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          for name in repo-harness-operator-web repo-harness; do
            tarball="$TARBALLS/$name-$VERSION.tgz"
            manifest="$(tar -xOzf "$tarball" package/package.json)"
            [[ "$(jq -r .name <<<"$manifest")" == "$name" && "$(jq -r .version <<<"$manifest")" == "$VERSION" ]] || fail "$tarball does not hold $name@$VERSION."
            if npm view "$name@$VERSION" version --json 2>"$RUNNER_TEMP/npm-view.err" >/dev/null; then
              fail "$name@$VERSION is already on npm."
            fi
            grep -Eq 'E404|404 Not Found|No match found|not in this registry' "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err"; fail "unable to prove $name@$VERSION is unpublished."; }
          done
      - name: Publish repo-harness-operator-web
        run: npm publish "$TARBALLS/repo-harness-operator-web-$VERSION.tgz" --provenance --ignore-scripts
      # The core package depends on the matching web version, so npm must show it first.
      - name: Wait until npm shows repo-harness-operator-web
        run: |
          for _ in $(seq 30); do
            [[ "$(npm view "repo-harness-operator-web@$VERSION" version 2>/dev/null)" == "$VERSION" ]] && exit 0
            sleep 10
          done
          echo "::error::npm does not show repo-harness-operator-web@$VERSION after 5 minutes."
          exit 1
      - name: Publish repo-harness
        run: npm publish "$TARBALLS/repo-harness-$VERSION.tgz" --provenance --ignore-scripts

  release:
    name: Read back, tag and release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # GH_TOKEN reaches only the steps that call gh; install and readback steps run package scripts.
    env:
      SHA: ${{ inputs.sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: bun install --frozen-lockfile
      - name: Read back the published packages
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/release-owner-steps.sh check published "$VERSION"
      # The API creates the annotated tag, so the checkout keeps no credentials.
      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="repo-harness $VERSION" -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_object" >/dev/null
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/release-owner-steps.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "repo-harness $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Read back the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/release-owner-steps.sh check tagged "$VERSION"
