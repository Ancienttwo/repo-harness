name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Daily snapshots finish even when main moves; PR candidates supersede old runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    name: Select test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - id: select
        run: bun scripts/select-ci-coverage.ts
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.mode == 'affected'
        with:
          name: affected-tests
          path: .ci-affected-tests.json
          include-hidden-files: true
          if-no-files-found: error

  test-home-isolation:
    name: Test HOME isolation (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.mode == 'affected' || needs.selection.outputs.mode == 'daily'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Run the isolation tests
        shell: bash
        run: |
          source scripts/lib/ci-run-tests.sh
          run_bun_test_file tests/preload-home-isolation.test.ts

  verify:
    name: Typecheck and affected tests
    needs: selection
    if: needs.selection.outputs.mode == 'affected'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/download-artifact@v4
        with:
          name: affected-tests
      - name: Install pinned Herdr runtime
        uses: ./.github/actions/install-pinned-herdr
      - run: bash scripts/check-ci.sh affected

  governance:
    name: Daily governance
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO_HARNESS_DIFF_BASE: ${{ needs.selection.outputs.sha }}
      REPO_HARNESS_DIFF_MODE: direct
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: bash scripts/check-ci.sh governance

  test:
    name: Daily full tests and package
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUN_TEST_MAX_CONCURRENCY: '1'
      BUN_TEST_TIMEOUT_MS: '60000'
      BUN_TEST_ISOLATE_FILES: '1'
      BUN_TEST_JOBS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install pinned Herdr runtime
        uses: ./.github/actions/install-pinned-herdr
      - run: bash scripts/check-ci.sh functional

  mcp-path-matrix:
    name: Daily MCP path matrix (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux is already covered by the daily full-test owner.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Isolate the native test home
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const root = path.resolve("/tmp");
            fs.mkdirSync(root, { recursive: true });
            const canonical = fs.realpathSync(root);
            const home = fs.mkdtempSync(path.join(canonical, "rh-test-home-"));
            const temp = fs.mkdtempSync(path.join(canonical, "rh-test-tmp-"));
            const env = { HOME: home, USERPROFILE: home, TMPDIR: temp, TEMP: temp, TMP: temp };
            fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(env).map(([key, value]) => key + "=" + value).join("\n") + "\n");
          '
      - env:
          REPO_HARNESS_WINDOWS_PROTECTED_HELPER_SMOKE: '1'
        run: >-
          bun test --timeout 60000 --max-concurrency 1
          tests/preload-home-isolation.test.ts
          tests/cli/mcp-workspaces.test.ts tests/cli/mcp-reader-tools.test.ts
          tests/cli/mcp-policy.test.ts tests/cli/mcp-http.test.ts tests/cli/mcp-oauth.test.ts
          tests/cli/mcp-stdio.test.ts tests/effects/fleet-collector-process.test.ts
          tests/effects/operator-task-diff.test.ts tests/effects/operator-task-context.test.ts
          tests/effects/operator-task-activity.test.ts tests/effects/task-inbox.test.ts
          tests/effects/task-reply.test.ts tests/effects/task-inbox-layout-migration.test.ts
          tests/cli/windows-protected-helper-runtime-smoke.test.ts tests/evidence-checkpoint.test.ts

  required:
    name: Required / CI
    if: always() && github.event_name == 'pull_request'
    needs: [selection, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Consume the single candidate verification
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          COVERAGE_MODE: ${{ needs.selection.outputs.mode }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          [ "$SELECTION_RESULT" = success ] && [ "$COVERAGE_MODE" = affected ] && [ "$VERIFY_RESULT" = success ]
