name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      BUN_TEST_MAX_CONCURRENCY: "1"
      BUN_TEST_TIMEOUT_MS: "180000"
      BUN_TEST_ISOLATE_FILES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq rsync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: CI gate
        run: bun run check:ci

      - name: Diff hygiene
        run: git diff --check

  mcp-path-matrix:
    name: MCP path matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TEMP windows supervisor probe
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          cat > "$GITHUB_WORKSPACE/windows-probe.ts" <<'PROBE'
          import { spawn } from 'child_process';
          import { runProcess } from './src/effects/process-runner';

          const t0 = Date.now();
          const plain = runProcess(process.execPath, ['-e', 'console.log("PLAIN_OK")'], {
            cwd: process.cwd(), stdio: 'pipe', timeoutMs: 8000,
          });
          console.log('PROBE1 unsupervised', Date.now() - t0, JSON.stringify({
            ok: plain.ok, status: plain.status, timedOut: plain.timedOut,
            stdout: plain.stdout, stderr: plain.stderr, error: plain.error,
          }));

          const t1 = Date.now();
          const supervised = runProcess(process.execPath, ['-e', 'console.log("SUPERVISED_OK")'], {
            cwd: process.cwd(), stdio: 'pipe', processGroup: true, timeoutMs: 8000,
          });
          console.log('PROBE2 supervised', Date.now() - t1, JSON.stringify({
            ok: supervised.ok, status: supervised.status, timedOut: supervised.timedOut,
            stdout: supervised.stdout, stderr: supervised.stderr, error: supervised.error,
          }));

          const child = spawn(process.execPath, ['-e',
            'for await (const c of Bun.file(3).stream()) { if (c.length > 0) { console.log("BARRIER_RELEASED"); process.exit(0); } } console.log("BARRIER_EOF_NO_DATA");',
          ], { stdio: ['ignore', 'pipe', 'pipe', 'pipe'] });
          let out = '';
          child.stdout?.on('data', (chunk) => { out += String(chunk); });
          const started = Date.now();
          const timer = setTimeout(() => {
            console.log('PROBE3 barrier HANG', Date.now() - started, JSON.stringify(out));
            child.kill();
            process.exit(0);
          }, 8000);
          child.once('exit', (code) => {
            clearTimeout(timer);
            console.log('PROBE3 barrier exit', code, Date.now() - started, JSON.stringify(out));
            process.exit(0);
          });
          (child.stdio[3] as NodeJS.WritableStream).end('start\n');
          PROBE
          bun "$GITHUB_WORKSPACE/windows-probe.ts"
          rm -f "$GITHUB_WORKSPACE/windows-probe.ts"

      - name: MCP path security and protected helper platform tests
        env:
          REPO_HARNESS_WINDOWS_PROTECTED_HELPER_SMOKE: "1"
        run: >-
          bun test --timeout 180000 --max-concurrency 1
          tests/cli/mcp-workspaces.test.ts
          tests/cli/mcp-reader-tools.test.ts
          tests/cli/mcp-policy.test.ts
          tests/cli/mcp-http.test.ts
          tests/cli/mcp-oauth.test.ts
          tests/cli/mcp-stdio.test.ts
          tests/cli/windows-protected-helper-runtime-smoke.test.ts

  # Stable aggregate context for branch protection. Binding protection to the
  # individual jobs means the matrix OS list is part of the protection rule:
  # add or rename an OS and the required contexts silently reference check runs
  # that never report again. Protection requires only this job.
  required:
    name: Required / CI
    runs-on: ubuntu-latest
    # Must run even when a dependency fails, otherwise a failed run leaves this
    # context skipped and the required check never reports at all.
    if: always()
    needs:
      - test
      - mcp-path-matrix
    steps:
      - name: Assert upstream jobs succeeded
        run: |
          echo "test=${{ needs.test.result }}"
          echo "mcp-path-matrix=${{ needs.mcp-path-matrix.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.mcp-path-matrix.result }}" = "success" ] || exit 1
