name: CI

on:
  pull_request:
    types: [opened, synchronize]
  # The merge queue tests each queued PR on its temporary branch; Required / CI is its required check.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Daily snapshots finish even when main moves; PR candidates supersede old runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    name: Select test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      sha: ${{ steps.select.outputs.sha }}
      native_oar: ${{ steps.select.outputs.native_oar }}
      home_isolation: ${{ steps.select.outputs.home_isolation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The documentation consumer scanner parses tests with the installed TypeScript API.
      - run: bun install --frozen-lockfile
      - name: Reject protected Git paths
        run: bun scripts/check-protected-paths.ts --tracked
      # Entries are keyed by the analyzer fingerprint and by file content; the selector
      # parses each file that has no valid entry. A push to main saves the main entries.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-path-references.json
          key: ci-path-references-${{ github.sha }}
          restore-keys: ci-path-references-
      # The daily run on main saves the newest test durations; they set only the shard balance and order.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-durations.json
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
      - id: select
        env:
          CI_PATH_REFERENCE_CACHE: ${{ runner.temp }}/ci-path-references.json
          TEST_DURATIONS_FILE: ${{ runner.temp }}/test-durations.json
          # The verify matrix runs one shard per plan array.
          CI_SHARD_TOTAL: 3
        run: bun scripts/select-ci-coverage.ts
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.mode == 'affected'
        with:
          name: affected-tests-${{ steps.select.outputs.sha }}
          path: .ci-affected-tests.json
          include-hidden-files: true
          if-no-files-found: error

  # A push to main runs only selection; a documentation-only diff runs no check
  # job. Pull requests, daily and manual runs keep this check.
  state-boundaries:
    name: State boundaries
    needs: selection
    if: github.event_name != 'push' && needs.selection.outputs.mode != 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The core/plugin rule runs package-local archctx, which needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check:state-boundaries

  home-isolation:
    name: Test HOME isolation (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.mode == 'daily' || (needs.selection.outputs.mode == 'affected' && needs.selection.outputs.home_isolation != 'false')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One platform failure must not cancel the other platforms' evidence (#665).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # The test preload registers the architecture providers, which import archctx-contracts.
      - run: bun install --frozen-lockfile
      - name: Run the isolation tests
        shell: bash
        run: |
          source scripts/lib/ci-run-tests.sh
          run_bun_test_file tests/preload-home-isolation.test.ts
          run_bun_test_file tests/unit/trusted-gh-executable.test.ts

  native-oar:
    name: Native OAR acceptance (macOS)
    needs: selection
    if: needs.selection.outputs.mode == 'daily' || (needs.selection.outputs.mode == 'affected' && needs.selection.outputs.native_oar != 'false')
    runs-on: macos-latest
    # Two legs: the wait for a macOS runner, not the test time, set the wall
    # time (#2242). generic-review alone is about as long as the other three
    # files together. Each leg gets its own 10-minute budget, and one leg's
    # failure does not cancel the other leg's evidence (#1296).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/generic-review.test.ts
          - tests/acceptance-receipt.test.ts tests/herdr-task-lifecycle.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned herdr-core runtime
        uses: ./.github/actions/install-pinned-herdr-core
      - name: Run native OAR acceptance tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.selection.outputs.sha }}
          MODE: ${{ needs.selection.outputs.mode }}
          TEST_FILES: ${{ matrix.test }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bun -e 'if (process.platform !== "darwin") process.exit(1)'
          node -e 'if (process.platform !== "darwin" || process.versions.bun || !process.versions.node.startsWith("24.")) process.exit(1)'
          test -x /usr/bin/sandbox-exec
          bun install --frozen-lockfile
          test ! -e dist/oar-review-host.js
          bun run build:oar-review-host
          test -s dist/oar-review-host.js
          case "$MODE" in
            affected) set -- -t 'darwin: ' ;;
            daily) set -- ;;
            *) echo "Unknown coverage mode: $MODE" >&2; exit 1 ;;
          esac
          read -r -a files <<< "$TEST_FILES"
          bun run test:files "${files[@]}" "$@" --timeout 60000 --max-concurrency 1

  verify:
    name: Affected tests (shard ${{ matrix.shard }}/3)
    needs: selection
    if: needs.selection.outputs.mode == 'affected'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Each shard keeps its own failure evidence; Required / CI reads the matrix result.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/download-artifact@v4
        with:
          name: affected-tests-${{ needs.selection.outputs.sha }}
      - name: Verify selected checkout
        env:
          EXPECTED_SHA: ${{ needs.selection.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned herdr-core runtime
        uses: ./.github/actions/install-pinned-herdr-core
      - run: bash scripts/check-ci.sh affected
        env:
          CI_SHARD: ${{ matrix.shard }}/3
      # Per-file JUnit reports from scripts/lib/ci-run-tests.sh. A shard with no selected file has none.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # scripts/report-ci.ts reads this report to key repair issues by test.
          name: junit-affected-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .ai/harness/runs/junit
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The projection follows every import edit, so it is generated on the tested
  # commit and uploaded beside the JUnit reports instead of being committed.
  # Evidence only: not part of the Required / CI aggregate.
  test-projection:
    name: Test capability projection
    needs: selection
    if: needs.selection.outputs.mode == 'affected' || needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/project-test-capabilities.ts --out "$RUNNER_TEMP/test-capability-projection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-projection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-capability-projection.json
          if-no-files-found: error
          retention-days: 14

  # Required / CI reads this job. Only the plugin-internals constraint
  # (ADR-0002 rule 5) can fail it; architecture debt and hand edits are warnings.
  architecture-advisory:
    name: PR architecture constraint and freshness
    needs: selection
    if: needs.selection.outputs.mode == 'affected'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Check the plugin-internals constraint and warn about architecture debt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash scripts/check-ci.sh architecture-advisory --base "$BASE_SHA"

  governance:
    name: Daily governance
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: bash scripts/check-ci.sh governance

  architecture:
    name: Daily architecture freshness
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Check architecture documents
        env:
          ARCHITECTURE_SUMMARY: ${{ runner.temp }}/architecture/summary.json
        run: bash scripts/check-ci.sh architecture
      # scripts/report-ci.ts reads this summary for the repair issue.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-freshness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architecture/summary.json
          if-no-files-found: warn

  test:
    name: Daily full tests and package
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUN_TEST_MAX_CONCURRENCY: '1'
      BUN_TEST_TIMEOUT_MS: '60000'
      BUN_TEST_ISOLATE_FILES: '1'
      BUN_TEST_JOBS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y jq rsync
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install pinned herdr-core runtime
        uses: ./.github/actions/install-pinned-herdr-core
      - run: bash scripts/check-ci.sh functional
      # Only the daily run on main writes the durations cache; pull request runs restore it.
      - id: durations
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: bun scripts/select-test-suite.ts durations .ai/harness/runs/junit "$RUNNER_TEMP/test-durations.json"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.durations.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/test-durations.json
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # scripts/report-ci.ts reads this report to key repair issues by test.
          name: junit-daily-${{ github.run_attempt }}
          path: .ai/harness/runs/junit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  mcp-path-matrix:
    name: Daily MCP path matrix (${{ matrix.os }})
    needs: selection
    if: needs.selection.outputs.mode == 'daily'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux is already covered by the daily full-test owner.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.selection.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Run the native path tests
        shell: bash
        env:
          BUN_TEST_MAX_CONCURRENCY: '1'
          REPO_HARNESS_WINDOWS_PROTECTED_HELPER_SMOKE: '1'
        run: |
          source scripts/lib/ci-run-tests.sh
          BUN_TEST_ISOLATE_FILES=0 run_bun_tests \
          tests/preload-home-isolation.test.ts \
          tests/cli/mcp-workspaces.test.ts tests/cli/mcp-reader-tools.test.ts \
          tests/cli/mcp-policy.test.ts tests/cli/mcp-http.test.ts tests/cli/mcp-oauth.test.ts \
          tests/cli/mcp-stdio.test.ts tests/effects/windows-job-controller.test.ts \
          tests/effects/operator-task-context.test.ts tests/effects/operator-task-activity.test.ts \
          tests/cli/windows-protected-helper-runtime-smoke.test.ts tests/evidence-checkpoint.test.ts \
          tests/unit/windows-protected-helper-platform-contract.test.ts \
          tests/unit/exclusive-directory-lock-owner-identity.test.ts
      # Admitted task sessions start only in a Herdr pane, which is POSIX-only.
      - name: Run the POSIX task-session path tests
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          BUN_TEST_MAX_CONCURRENCY: '1'
        run: |
          source scripts/lib/ci-run-tests.sh
          BUN_TEST_ISOLATE_FILES=0 run_bun_tests \
          tests/effects/task-inbox.test.ts \
          tests/effects/task-inbox-layout-migration.test.ts
      - name: Run smoke with each installed internal Git first on PATH
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          BUN_TEST_MAX_CONCURRENCY: '1'
          REPO_HARNESS_WINDOWS_PROTECTED_HELPER_SMOKE: '1'
        run: |
          source scripts/lib/ci-run-tests.sh
          echo "Git Bash installation: $(cygpath -w /)"
          test -f /cmd/git.exe
          tested=0
          for layout in mingw64 ucrt64; do
            internal="/$layout/bin"
            if [[ ! -f "$internal/git.exe" ]]; then
              echo "Layout $layout is not installed; no coverage is claimed."
              continue
            fi
            (
              export PATH="$internal:$PATH"
              echo "Native smoke with $layout first on PATH"
              where.exe git
              "$internal/git.exe" --version
              BUN_TEST_ISOLATE_FILES=0 run_bun_tests tests/cli/windows-protected-helper-runtime-smoke.test.ts
            )
            tested=$((tested + 1))
          done
          test "$tested" -gt 0

  required:
    name: Required / CI
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [selection, state-boundaries, verify, home-isolation, native-oar, architecture-advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Consume the single candidate verification
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          STATE_BOUNDARIES_RESULT: ${{ needs.state-boundaries.result }}
          COVERAGE_MODE: ${{ needs.selection.outputs.mode }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          HOME_ISOLATION_RESULT: ${{ needs.home-isolation.result }}
          HOME_ISOLATION: ${{ needs.selection.outputs.home_isolation }}
          NATIVE_OAR_RESULT: ${{ needs.native-oar.result }}
          NATIVE_OAR: ${{ needs.selection.outputs.native_oar }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-advisory.result }}
        run: |
          # A documentation-only diff selects no build, test or check job.
          [ "$SELECTION_RESULT" = success ] \
            && { [ "$STATE_BOUNDARIES_RESULT" = success ] || { [ "$COVERAGE_MODE" = documentation ] && [ "$STATE_BOUNDARIES_RESULT" = skipped ]; }; } \
            && { { [ "$COVERAGE_MODE" = affected ] && [ "$VERIFY_RESULT" = success ]; } || { [ "$COVERAGE_MODE" = documentation ] && [ "$VERIFY_RESULT" = skipped ]; }; } \
            && { [ "$HOME_ISOLATION_RESULT" = success ] || { [ "$HOME_ISOLATION" = false ] && [ "$HOME_ISOLATION_RESULT" = skipped ]; }; } \
            && { [ "$NATIVE_OAR_RESULT" = success ] || { [ "$NATIVE_OAR" = false ] && [ "$NATIVE_OAR_RESULT" = skipped ]; }; } \
            && { [ "$ARCHITECTURE_RESULT" = success ] || { [ "$COVERAGE_MODE" = documentation ] && [ "$ARCHITECTURE_RESULT" = skipped ]; }; }
