body { margin: 0; background: #F3EEE4; font-family: 'IBM Plex Sans', 'PingFang SC', system-ui, sans-serif; color: #14202E }
html[data-theme="dark"] body { background: #0E1822 }
a { color: #244C9E } a:hover { color: #14202E }
.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #DBCFB6 }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px }
.bar nav a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: #51647B; font-size: 14px }
.bar nav a[aria-current="page"] { background: #14202E; color: #FFFFFF }
.bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #51647B }
.bar select { font: inherit; padding: 4px 6px; border: 1px solid #DBCFB6; border-radius: 6px; background: #FFFFFF }
.stage { position: relative }
body { margin: 0 }
.pxs { --s: 3 }
@media (max-width: 1100px) { .pxs { --s: 2 } }
.pxs-2 { --s: 2 }
svg[shape-rendering="crispEdges"] { image-rendering: pixelated }
.px-hit:hover { background: rgba(255, 249, 238, 0.10) }
.px-hit:focus-visible { outline: 3px solid #2D5BB8; outline-offset: 2px }

<script type="application/json" id="dc-src">{"Main": {"html": "<div style=\"{{rootVars}}; position: relative; min-height: 900px; box-sizing: border-box; background: var(--canvas); color: var(--text); font-family: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 1.5; padding: 32px clamp(16px, 3vw, 32px)\">\n  <div style=\"max-width: 1376px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px\">\n      <span title=\"老板（你）：平静。萝卜和大棒在各房间里触发\" style=\"position: relative; flex: none; width: 44px; height: 52px; border-radius: 8px; background: var(--accent-t); box-shadow: inset 0 0 0 2px var(--accent); overflow: hidden\">\n        <svg viewBox=\"0 0 16 22\" width=\"32\" height=\"44\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" style=\"position: absolute; left: 6px; top: 5px; {{bossMove}}\"><sc-for list=\"{{boss}}\" as=\"p\" hint-placeholder-count=\"8\"><path d=\"{{p.d}}\" fill=\"{{p.c}}\"><\/path><\/sc-for><\/svg>\n        <span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">老板（你）：平静<\/span>\n      <\/span>\n      <h1 style=\"margin: 0; font-family: 'Space Grotesk', 'PingFang SC', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--strong)\">看板<\/h1>\n      <div style=\"display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--base); border: 1px solid var(--line)\" role=\"group\" aria-label=\"视图\">\n        <button type=\"button\" aria-pressed=\"true\" style=\"height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--tint); color: var(--strong); font: inherit; font-weight: 500; cursor: pointer\">办公室<\/button>\n        <button type=\"button\" aria-pressed=\"false\" style=\"height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--subtle); font: inherit; cursor: pointer\">列表<\/button>\n      <\/div>\n      <div style=\"margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">\n        <sc-for list=\"{{totals}}\" as=\"t\" hint-placeholder-count=\"5\">\n          <span style=\"display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}\"><span style=\"width: 8px; height: 8px; background: {{t.dot}}\"><\/span>{{t.text}}<\/span>\n        <\/sc-for>\n        <button type=\"button\" onClick=\"{{openFlow}}\" style=\"height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--base); color: var(--strong); font: 500 13px 'IBM Plex Sans', 'PingFang SC', sans-serif; cursor: pointer\">图例与流程<\/button>\n      <\/div>\n    <\/header>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 16px\">\n      <sc-for list=\"{{offices}}\" as=\"o\" hint-placeholder-count=\"8\">\n        <button type=\"button\" onClick=\"{{o.open}}\" aria-label=\"{{o.aria}}\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 12px; text-align: left; cursor: pointer; border-radius: 12px; background: var(--base); border: 1px solid var(--line); {{o.ring}}; font: inherit; color: inherit\">\n          <svg viewBox=\"0 0 112 72\" width=\"224\" height=\"144\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" style=\"display: block; align-self: center; box-shadow: 0 0 0 2px var(--px-ink)\"><sc-for list=\"{{o.room}}\" as=\"p\" hint-placeholder-count=\"20\"><path d=\"{{p.d}}\" fill=\"{{p.c}}\"><\/path><\/sc-for><\/svg>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <span style=\"display: flex; align-items: baseline; gap: 8px\">\n              <span style=\"font: 600 14px 'JetBrains Mono', monospace; color: var(--strong)\">{{o.name}}<\/span>\n              <span style=\"font-size: 12px; color: var(--subtle)\">{{o.sub}}<\/span>\n            <\/span>\n            <span style=\"display: flex; flex-wrap: wrap; gap: 4px\">\n              <sc-for list=\"{{o.chips}}\" as=\"c\" hint-placeholder-count=\"3\">\n                <span style=\"padding: 0 6px; font: 500 11.5px/18px 'JetBrains Mono', monospace; background: {{c.bg}}; color: {{c.fg}}\">{{c.text}}<\/span>\n              <\/sc-for>\n            <\/span>\n          <\/div>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n\n  <sc-if value=\"{{showRoom}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14, 24, 34, 0.5); display: flex; justify-content: center; align-items: flex-start; padding: 72px 16px 0\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"{{roomTitle}}\" style=\"position: relative; max-width: 100%; overflow-x: auto; border-radius: 12px; box-shadow: 0 12px 28px rgba(20, 32, 46, 0.12), 0 4px 8px rgba(20, 32, 46, 0.06)\">\n        <dc-import name=\"Room\" preset=\"{{modal}}\" compact=\"{{ true }}\" dark=\"{{dark}}\" scene=\"{{scene}}\" hint-size=\"642px,536px\"><\/dc-import>\n        <div style=\"display: flex; gap: 8px; justify-content: flex-end; padding: 10px 12px; background: var(--base); border-top: 1px solid var(--line)\">\n          <a href=\"#room/{{modal}}\" style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--brand); color: #FFFFFF; text-decoration: none; font: 600 14px 'Space Grotesk', 'PingFang SC', sans-serif\">进入房间<\/a>\n          <button type=\"button\" onClick=\"{{close}}\" style=\"height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--base); color: var(--strong); font: 500 14px 'IBM Plex Sans', 'PingFang SC', sans-serif; cursor: pointer\">关闭<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{showFlow}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14, 24, 34, 0.5); display: flex; justify-content: center; align-items: flex-start; padding: 72px 16px 0\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"flow-title\" style=\"width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 12px; background: var(--base); border: 1px solid var(--line); box-shadow: 0 12px 28px rgba(20, 32, 46, 0.12), 0 4px 8px rgba(20, 32, 46, 0.06)\">\n        <div style=\"display: flex; align-items: center\">\n          <h2 id=\"flow-title\" style=\"margin: 0; font: 600 18px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">图例与流程<\/h2>\n          <button type=\"button\" onClick=\"{{close}}\" aria-label=\"关闭\" style=\"margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--subtle); cursor: pointer\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M3 3l10 10M13 3L3 13\"><\/path><\/svg>\n          <\/button>\n        <\/div>\n        <div style=\"overflow-x: auto\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(118px, 1fr) 40px) minmax(118px, 1fr); align-items: center; min-width: 760px\">\n          <div style=\"grid-column: 1; grid-row: 1; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--rec); border: 1px solid var(--line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">编排席<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">发 plan，派工，验收<\/div>\n          <\/div>\n          <div style=\"grid-column: 2; grid-row "M7 2V24M3 20L7 24L11 20\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span style=\"font-size: 11px; color: var(--subtle)\">派工<\/span><\/div>\n          <div style=\"grid-column: 1; grid-row: 3; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--rec); border: 1px solid var(--line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">执行席<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">plan 上限，最多 8<\/div>\n          <\/div>\n          <div style=\"grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\"><svg width=\"32\" height=\"14\" viewBox=\"0 0 32 14\" aria-hidden=\"true\"><path d=\"M3 7H29M25 3L29 7L25 11\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div>\n          <div style=\"grid-column: 3; grid-row: 3; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--info-t); border: 1px solid var(--info-line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">CI<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">按 runner 并发<\/div>\n          <\/div>\n          <div style=\"grid-column: 4; grid-row: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\"><svg width=\"32\" height=\"14\" viewBox=\"0 0 32 14\" aria-hidden=\"true\"><path d=\"M3 7H29M25 3L29 7L25 11\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div>\n          <div style=\"grid-column: 5; grid-row: 3; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--info-t); border: 1px solid var(--info-line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">验收队列<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">编排席验收<\/div>\n          <\/div>\n          <div style=\"grid-column: 6; grid-row: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\"><svg width=\"32\" height=\"14\" viewBox=\"0 0 32 14\" aria-hidden=\"true\"><path d=\"M3 7H29M25 3L29 7L25 11\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div>\n          <div style=\"grid-column: 7; grid-row: 3; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--info-t); border: 1px solid var(--info-line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">批次车<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">最多 6 个 PR<\/div>\n          <\/div>\n          <div style=\"grid-column: 8; grid-row: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\"><svg width=\"32\" height=\"14\" viewBox=\"0 0 32 14\" aria-hidden=\"true\"><path d=\"M3 7H29M25 3L29 7L25 11\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div>\n          <div style=\"grid-column: 9; grid-row: 3; box-sizing: border-box; padding: 10px 8px; border-radius: 8px; background: var(--rec); border: 1px solid var(--line); text-align: center\">\n            <div style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">main<\/div>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--subtle)\">集成者合并<\/div>\n          <\/div>\n          <\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--subtle)\">\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"display: inline-grid; place-items: center; width: 22px; height: 16px; background: var(--claude-dk); color: #FFFFFF; font: 700 9px 'JetBrains Mono', monospace\">CC<\/span>Claude Code<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"display: inline-grid; place-items: center; width: 22px; height: 16px; background: var(--codex-dk); color: #FFFFFF; font: 700 9px 'JetBrains Mono', monospace\">CX<\/span>Codex<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"display: inline-grid; place-items: center; width: 22px; height: 16px; box-sizing: border-box; border: 1px dashed var(--subtle); color: var(--subtle); font: 700 9px 'JetBrains Mono', monospace\">?<\/span>agent 未知<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: var(--px-screen); box-shadow: 0 0 0 1px var(--px-ink)\"><\/span>编码中 · 亮蓝屏<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: var(--px-danger); box-shadow: 0 0 0 1px var(--px-ink)\"><\/span>CI 失败 · 红屏红灯<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: var(--px-ink); box-shadow: 0 0 0 1px var(--px-screen)\"><\/span>等 CI · 黑屏进度条，蓝灯<\/span>\n          <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: var(--px-ink); box-shadow: 0 0 0 1px var(--px-warn)\"><\/span>无状态 · 黑屏，Zz<\/span>\n          <span style=\"display: inlin '#F28C3A', leaf: '#5E9C43', sky: '#9FD0F2' };\nvar PX_NIGHT = { ink: '#0A0F18', ink2: '#1C2638', slate: '#34445A', mist: '#5D6E85', cloud: '#8C9AAE', paper: '#E8E2D4', wall: '#2B3850', wallSh: '#222D42', wood: '#6E5138', woodDk: '#3E2E20', floorA: '#433E48', floorB: '#3B3741', floorSh: '#29262E', deskTop: '#8E7E6A', deskFr: '#6A5D4E', skin: '#D3A684', skinSh: '#9E7258', shirt: '#344963', claude: '#C8643A', claudeDk: '#85401F', codex: '#4F84DC', codexDk: '#2A4F96', screen: '#78C8FF', danger: '#FF5B4F', dangerDk: '#A3302A', warn: '#FFC85A', warnDk: '#B5821F', ok: '#52C98E', okDk: '#2E8058', accent: '#FF9C4A', leaf: '#3E6B3B', sky: '#142440' };\nvar PX_IDX = {};\nPX_KEYS.forEach(function (k, i) { PX_IDX[k] = i + 1; });\nvar PX_DARK = { floorA: 'floorSh', floorB: 'floorSh', wall: 'wallSh', deskTop: 'deskFr', deskFr: 'wood', wood: 'woodDk', paper: 'cloud', cloud: 'mist', mist: 'slate', slate: 'ink2', ink2: 'ink', leaf: 'okDk', sky: 'codex', wallSh: 'wood' };\nvar PX_LIGHT = { floorSh: 'floorB', floorB: 'floorA', floorA: 'wood' };\nvar PX_SUN = { floorSh: 'floorB', floorB: 'floorA' };\n\nfunction pxVars(night) {\n  var P = night ? PX_NIGHT : PX_DAY;\n  return PX_KEYS.map(function (k) { return '--px-' + k + ':' + P[k]; }).join(';');\n}\n\n// 3x5 sign font, rows top to bottom, 3 bits each.\nvar PX_FONT = {\n  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '1000111011101011000110001', N: '10011101101110011001', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '1000110001101011101110001', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',\n  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': : flex; flex-direction: column; gap: 12px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px\">\n      <h2 style=\"margin: 0; font: 600 15px/1.4 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">Claude Code 动作<\/h2>\n      <span style=\"font: 12px 'JetBrains Mono', monospace; color: var(--subtle)\">动作跟着座位状态和老板指令走 · 每套 2 到 4 帧<\/span>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px\">\n      <sc-for list=\"{{acts}}\" as=\"a\" hint-placeholder-count=\"9\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--base); border: 1px solid var(--line); border-radius: 12px\">\n          <svg viewBox=\"0 0 32 24\" width=\"128\" height=\"96\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" style=\"display: block; align-self: center; box-shadow: 0 0 0 2px var(--px-ink)\"><sc-for list=\"{{a.scene}}\" as=\"p\" hint-placeholder-count=\"8\"><path d=\"{{p.d}}\" fill=\"{{p.c}}\"><\/path><\/sc-for><\/svg>\n          <span style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">{{a.name}}<\/span><span style=\"font: 12px 'JetBrains Mono', monospace; color: var(--subtle)\">{{a.key}}<\/span><span style=\"margin-left: auto; padding: 0 6px; font-size: 12px; background: {{a.tagBg}}; color: {{a.tagFg}}\">{{a.tag}}<\/span><\/span>\n          <span style=\"font-size: 12px; line-height: 1.6; color: var(--text)\">{{a.use}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <section style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font: 600 15px/1.4 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">工位与队列状态<\/h2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px\">\n      <sc-for list=\"{{ t,\n// 16x24 characters, the carrot boss and an indexed framebuffer that becomes\n// one SVG path per colour. Every scene is drawn on this grid at scale 2 or 3.\nvar PX_KEYS = ['ink', 'ink2', 'slate', 'mist', 'cloud', 'paper', 'wall', 'wallSh', 'wood', 'woodDk', 'floorA', 'floorB', 'floorSh', 'deskTop', 'deskFr', 'skin', 'skinSh', 'shirt', 'claude', 'claudeDk', 'codex', 'codexDk', 'screen', 'danger', 'dangerDk', 'warn', 'warnDk', 'ok', 'okDk', 'accent', 'leaf', 'sky'];\nvar PX_DAY = { ink: '#1B2433', ink2: '#34445C', slate: '#5B6D85', mist: '#9AA9BC', cloud: '#DCE4EC', paper: '#FFF9EE', wall: '#F1E3C6', wallSh: '#DCC7A0', wood: '#A06C3C', woodDk: '#6B4526', floorA: '#C99A64', floorB: '#BD8D58', floorSh: '#99693C', deskTop: '#F0DDB6', deskFr: '#D3B888', skin: '#F3CBA2', skinSh: '#D99A72', shirt: '#3F5874', claude: '#D46A3B', claudeDk: '#92421F', codex: '#3A6FD0', codexDk: '#21458F', screen: '#5BB1F2', danger: '#E2453C', dangerDk: '#9C2621', warn: '#F3B53F', warnDk: '#9A6410', ok: '#43A86C', okDk: '#25784A', accent: '#F28C3A', leaf: '#5E9C43', sky: '#9FD0F2' };\nvar PX_NIGHT = { ink: '#0A0F18', ink2: '#1C2638', slate: '#34445A', mist: '#5D6E85', cloud: '#8C9AAE', paper: '#E8E2D4', wall: '#2B3850', wallSh: '#222D42', wood: '#6E5138', woodDk: '#3E2E20', floorA: '#433E48', floorB: '#3B3741', floorSh: '#29262E', deskTop: '#8E7E6A', deskFr: '#6A5D4E', skin: '#D3A684', skinSh: '#9E7258', shirt: '#344963', claude: '#C8643A', claudeDk: '#85401F', codex: '#4F84DC', codexDk: '#2A4F96', screen: '#78C8FF', danger: '#FF5B4F', dangerDk: '#A3302A', warn: '#FFC85A', warnDk: '#B5821F', ok: '#52C98E', okDk: '#2E8058', accent: '#FF9C4A', leaf: '#3E6B3B', sky: '#142440' };\nvar PX_IDX = {};\nPX_KEYS.forEach(function (k, i) { PX_IDX[k] = i + 1; });\nvar PX_DARK = { floorA: 'floorSh', floorB: 'floorSh', wall: 'wallSh', deskTop: 'deskFr', deskFr: 'wood', wood: 'woodDk', paper: 'cloud', cloud: 'mist', mist: 'slate', slate: 'ink2', ink2: 'ink', leaf: 'okDk', sky: 'codex', wallSh: 'wood' };\nvar PX_LIGHT = { floorSh: 'floorB', floorB: 'floorA', floorA: 'wood' };\nvar PX_SUN = { floorSh: 'floorB', floorB: 'floorA' };\n\nfunction pxVars(night) {\n  var P = night ? PX_NIGHT : PX_DAY;\n  return PX_KEYS.map(function (k) { return '--px-' + k + ':' + P[k]; }).join(';');\n}\n\n// 3x5 sign font, rows top to bottom, 3 bits each.\nvar PX_FONT = {\n  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '1000111011101011000110001', N: '10011101101110011001', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '1000110001101011101110001', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',\n  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110', '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001110',\n  '#': '0101011111010101111101010', '-': '000000111000000', '.': '000000000000010', '·': '000000010000000', ':': '000010000010000', '>': '100010001010100', '<': '001010100010001', '?': '110001010000010', '!': '010010010000010', '+': '000010111010000', '/': '001001010100100', '_': '000000000000111', ' ': '000000000000000'\n};\nfunction pxGlyph(ch) { return PX_FONT[ch] || PX_FONT['?']; }\nfunction pxTextW(s) {\n  var str = String(s).toUpperCase(), w = 0;\n  for (var n = 0; n < str.length; n++) w += pxGlyph(str[n]).length / 5 + 1;\n  return w ? w - 1 : 0;\n}\n\n// Characters: k outline, h/H/j hat, r/R hair, s/S skin, e eye, m mouth, w collar, b/B shirt, d trousers, x shoes.\nvar PX_FRONT = [\n  '................', '.....kkkkkk.....', '....kjjhhhhk....', '...kjhhhhhhhk...', '...khhhhhhhhk...', '..kH     this.dead = true;
    if (this.comp.componentWillUnmount) this.comp.componentWillUnmount();
    this.el.childNodes.forEach(unmount);
  };

  window.dcMount = function (el, name, props) { return new Host(el, name, props); };
})();

</script>
<script>(function () {
  var NAME = { main: 'Main', room: 'Room', states: 'States' };
  var presets = ['repo-harness', 'aiphabee', 'AstroZi', 'arch-context', 'byok-sdk', 'fortune-algo', 'hegui-agent', 'enterprise-brain'];
  var sel = document.getElementById('opt-preset');
  var scene = document.getElementById('opt-scene');
  var dark = document.getElementById('opt-dark');
  presets.forEach(function (p) { var o = document.createElement('option'); o.textContent = p; sel.appendChild(o); });
  var q = new URLSearchParams(location.search);
  if (q.get('dark') === '1') dark.checked = true;
  if (q.get('scene')) scene.value = q.get('scene');
  var stage = document.getElementById('stage');
  var host = null;
  function show() {
    var route = (location.hash || '#main').slice(1).split('/');
    var key = NAME[route[0]] ? route[0] : 'main';
    if (key === 'room' && route[1]) {
      var want = decodeURIComponent(route[1]);
      if (presets.indexOf(want) >= 0) sel.value = want;
    }
    document.querySelectorAll('.bar nav a').forEach(function (a) {
      if (a.getAttribute('href').split('/')[0] === '#' + key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.bar label[data-for]').forEach(function (l) { l.hidden = l.dataset.for.split(' ').indexOf(key) < 0; });
    document.documentElement.dataset.theme = dark.checked ? 'dark' : 'light';
    if (host) host.destroy();
    stage.innerHTML = '';
    var el = document.createElement('div');
    stage.appendChild(el);
    host = window.dcMount(el, NAME[key], { preset: sel.value, scene: scene.value, dark: dark.checked });
  }
  window.addEventListener('hashchange', show);
  sel.addEventListener('change', function () { location.hash = '#room/' + encodeURIComponent(sel.value); });
  [scene, dark].forEach(function (c) { c.addEventListener('change', show); });
  show();
})();
</script>
