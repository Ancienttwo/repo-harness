{p.c}}\"><\/path><\/sc-for><\/svg>\n          <span style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font: 600 15px/1.3 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">{{b.name}}<\/span><span style=\"font: 12px 'JetBrains Mono', monospace; color: var(--subtle)\">{{b.key}}<\/span><span style=\"margin-left: auto; padding: 0 6px; font-size: 12px; background: {{b.tagBg}}; color: {{b.tagFg}}\">{{b.tag}}<\/span><\/span>\n          <span style=\"font-size: 12px; line-height: 1.6; color: var(--text)\">{{b.use}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <section style=\"display: flex; flex-direction: column; gap: 12px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px\">\n      <h2 style=\"margin: 0; font: 600 15px/1.4 'Space Grotesk', 'PingFang SC', sans-serif; color: var(--strong)\">调色板<\/h2>\n      <span style=\"font: 12px 'JetBrains Mono', monospace; color: var(--subtle)\">32 色 · 左半白天，右半夜晚 · 场景里只用这些颜色<\/span>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px\">\n      <sc-for list=\"{{swatches}}\" as=\"w\" hint-placeholder-count=\"32\">\n        <div style=\"display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--base); border: 1px solid var(--line); border-radius: 8px\">\n          <span style=\"flex: none; display: flex; width: 32px; height: 20px; box-shadow: 0 0 0 1px var(--line)\"><span style=\"flex: 1; background: {{w.day}}\"><\/span><span style=\"flex: 1; background: {{w.night}}\"><\/span><\/span>\n          <span style=\"font: 11.5px 'JetBrains Mono', monospace; color: var(--strong); overflow-wrap: anywhere\">{{w.name}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n<\/div>\n<\/div>\n", "js": "// Pixel office art kit: one 32-colour palette (day + night), a 3x5 sign font,\n// 16x24 characters, the carrot boss and an indexed framebuffer that becomes\n// one SVG path per colour. Every scene is drawn on this grid at scale 2 or 3.\nvar PX_KEYS = ['ink', 'ink2', 'slate', 'mist', 'cloud', 'paper', 'wall', 'wallSh', 'wood', 'woodDk', 'floorA', 'floorB', 'floorSh', 'deskTop', 'deskFr', 'skin', 'skinSh', 'shirt', 'claude', 'claudeDk', 'codex', 'codexDk', 'screen', 'danger', 'dangerDk', 'warn', 'warnDk', 'ok', 'okDk', 'accent', 'leaf', 'sky'];\nvar PX_DAY = { ink: '#1B2433', ink2: '#34445C', slate: '#5B6D85', mist: '#9AA9BC', cloud: '#DCE4EC', paper: '#FFF9EE', wall: '#F1E3C6', wallSh: '#DCC7A0', wood: '#A06C3C', woodDk: '#6B4526', floorA: '#C99A64', floorB: '#BD8D58', floorSh: '#99693C', deskTop: '#F0DDB6', deskFr: '#D3B888', skin: '#F3CBA2', skinSh: '#D99A72', shirt: '#3F5874', claude: '#D46A3B', claudeDk: '#92421F', codex: '#3A6FD0', codexDk: '#21458F', screen: '#5BB1F2', danger: '#E2453C', dangerDk: '#9C2621', warn: '#F3B53F', warnDk: '#9A6410', ok: '#43A86C', okDk: '#25784A', accent: '#F28C3A', leaf: '#5E9C43', sky: '#9FD0F2' };\nvar PX_NIGHT = { ink: '#0A0F18', ink2: '#1C2638', slate: '#34445A', mist: '#5D6E85', cloud: '#8C9AAE', paper: '#E8E2D4', wall: '#2B3850', wallSh: '#222D42', wood: '#6E5138', woodDk: '#3E2E20', floorA: '#433E48', floorB: '#3B3741', floorSh: '#29262E', deskTop: '#8E7E6A', deskFr: '#6A5D4E', skin: '#D3A684', skinSh: '#9E7258', shirt: '#344963', claude: '#C8643A', claudeDk: '#85401F', codex: '#4F84DC', codexDk: '#2A4F96', screen: '#78C8FF', danger: '#FF5B4F', dangerDk: '#A3302A', warn: '#FFC85A', warnDk: '#B5821F', ok: '#52C98E', okDk: '#2E8058', accent: '#FF9C4A', leaf: '#3E6B3B', sky: '#142440' };\nvar PX_IDX = {};\nPX_KEYS.forEach(function (k, i) { PX_IDX[k] = i + 1; });\nvar PX_DARK = { floorA: 'floorSh', floorB: 'floorSh', wall: 'wallSh', deskTop: 'deskFr', deskFr: 'wood', wood: 'woodDk', paper: 'cloud', cloud: 'mist', mist: 'slate', slate: 'ink2', ink2: 'ink', leaf: 'okDk', sky: 'codex', wallSh: 'wood' };\nvar PX_LIGHT = { floorSh: 'floorB', floorB: 'floorA', floorA: 'wood' };\nvar PX_SUN = { floorSh: 'floorB', floorB: 'floorA' };\n\nfunction pxVars(night) {\n  var P = night ? PX_NIGHT : PX_DAY;\n  return PX_KEYS.map(function (k) { return '--px-' + k + ':' + P[k]; }).join(';');\n}\n\n// 3x5 sign font, rows top to bottom, 3 bits each.\nvar PX_FONT = {\n  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '1000111011101011000110001', N: '10011101101110011001', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '1000110001101011101110001', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',\n  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110', '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001110',\n  '#': '0101011111010101111101010', '-': '000000111000000', '.': '000000000000010', '·': '000000010000000', ':': '000010000010000', '>': '100010001010100', '<': '001010100010001', '?': '110001010000010', '!': '010010010000010', '+': '000010111010000', '/': '001001010100100', '_': '000000000000111', ' ': '000000000000000'\n};\nfunction pxGlyph(ch) { return PX_FONT[ch] || PX_FONT['?']; }\nfunction pxTextW(s) {\n  var str = String(s).toUpperCase(), w = 0;\n  for (var n = 0; n < str.length; n++) w += pxGlyph(str[n]).length / 5 + 1;\n  return w ? w - 1 : 0;\n}\n\n// Characters: k outline, h/H/j hat, r/R hair, s/S skin, e eye, m mouth, w collar, b/B shirt, d trousers, x shoes.\nvar PX_FRONT = [\n  '................', '.....kkkkkk.....', '....kjjhhhhk....', '...kjhhhhhhhk...', '...khhhhhhhhk...', '..kHHHHHHHHHHk..',\n  '...krssssssrk...', '...ksesssseSk...', '...kssssss <script>(function () {
  var NAME = { main: 'Main', room: 'Room', states: 'States' };
  var presets = ['repo-harness', 'aiphabee', 'AstroZi', 'arch-context', 'byok-sdk', 'fortune-algo', 'hegui-agent', 'enterprise-brain'];
  var sel = document.getElementById('opt-preset');

  var dark = document.getElementById('opt-dark');
  presets.forEach(function (p) { var o = document.createElement('option'); o.textContent = p; sel.appendChild(o); });
  var q = new URLSearchParams(location.search);
  if (q.get('dark') === '1') dark.checked = true;
  if (q.get('scene')) scene.value = q.get('scene');
  var stage = document.getElementById('stage');
  var host = null;
  function show() {
    var route = (location.hash || '#main').slice(1).split('/');
    var key = NAME[route[0]] ? route[0] : 'main';
    if (key === 'room' && route[1]) {
      var want = decodeURIComponent(route[1]);
      if (presets.indexOf(want) >= 0) sel.value = want;
    }
    document.querySelectorAll('.bar nav a').forEach(function (a) {
      if (a.getAttribute('href').split('/')[0] === '#' + key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.bar label[data-for]').forEach(function (l) { l.hidden = l.dataset.for.split(' ').indexOf(key) < 0; });
    document.documentElement.dataset.theme = dark.checked ? 'dark' : 'light';
    if (host) host.destroy();
    stage.innerHTML = '';
    var el = document.createElement('div');
    stage.appendChild(el);
    host = window.dcMount(el, NAME[key], { preset: sel.value, scene: scene.value, dark: dark.checked });
  }
  window.addEventListener('hashchange', show);
  sel.addEventListener('change', function () { location.hash = '#room/' + encodeURIComponent(sel.value); });
  [scene, dark].forEach(function (c) { c.addEventListener('change', show); });
  show();
})();
