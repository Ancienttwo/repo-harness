<script>
(function () {
  var SRC = JSON.parse(document.getElementById('dc-src').textContent);
  var parser = new DOMParser();
  var defs = {};

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (part) {
    var next = typeof part === 'function' ? part(this.state) : part;

  });

  function lookup(expr, scope) {
    expr = expr.trim();
    if (LIT.test(expr)) return expr[0] === "'" ? expr.slice(1, -1) : JSON.parse(expr);
    var parts = expr.split('.');
    var v;
    for (var i = scope.length - 1; i >= 0; i--) {
      if (scope[i] && Object.prototype.hasOwnProperty.call(scope[i], parts[0])) { v = scope[i][parts[0]]; break; }
    }
    for (var j = 1; j < parts.length && v != null; j++) v = v[parts[j]];
    return v;
  }
  var ONE = /^\{\{([^}]*)\}\}$/;
  function value(text, scope) {
    var m = text.match(ONE);
    if (m) return lookup(m[1], scope);
    return text.replace(/\{\{([^}]*)\}\}/g, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  var EVENTS = { onclick: 'click', onchange: 'input', onsubmit: 'submit', oninput: 'input', onkeydown: 'keydown' };

  function build(tpl, scope, out, host) {
    tpl.childNodes.forEach(function (n) {
      if (n.nodeType === 3) { out.push(document.createTextNode(value(n.data, scope))); return; }
      if (n.nodeType !== 1) return;

      if (tag === 'sc-if') { if (value(n.getAttribute('value'), scope)) build(n, scope, out, host); return; }

        var list = value(n.getAttribute('list'), scope) || [];

      });

      build(n, scope, kids, host);
      kids.forEach(function (k) { el.appendChild(k); });

<script>
(function () {
  var SIZE = { main: [1440, 900], room: [1280, 860], states: [1280, 700], boss: [1280, 1080] };
  var NAME = { main: 'Main', room: 'Room', states: 'States', boss: 'Boss' };
  var presets = ['repo-harness', 'arch-context', 'byok-sdk', 'aiphabee', 'AstroZi'];
  var sel = document.getElementById('opt-preset');
  presets.forEach(function (p) { var o = document.createElement('option'); o.textContent = p; sel.appendChild(o); });
  var stage = document.getElementById('stage');
  var host = null;
  function show() {
    var key = (location.hash || '#main').slice(1);
    if (!NAME[key]) key = 'main';
    document.querySelectorAll('.bar nav a').forEach(function (a) {
      if (a.getAttribute('href') === '#' + key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.bar label[data-for]').forEach(function (l) { l.hidden = l.dataset.for.split(' ').indexOf(key) < 0; });
    var dark = document.getElementById('opt-dark').checked;
    document.body.style.background = dark ? '#0E1822' : '#F3EEE4';
    if (host) host.destroy();
    stage.innerHTML = '';
    stage.style.width = SIZE[key][0] + 'px';
    stage.style.minHeight = SIZE[key][1] + 'px';
    var el = document.createElement('div');
    el.style.minHeight = SIZE[key][1] + 'px';
    stage.appendChild(el);
    host = window.dcMount(el, NAME[key], { preset: sel.value, scene: document.getElementById('opt-scene').value, dark: dark });
  }
  window.addEventListener('hashchange', show);
  ['opt-preset', 'opt-scene', 'opt-dark'].forEach(function (id) { document.getElementById(id).addEventListener('change', show); });
  show();
})();
</script>
